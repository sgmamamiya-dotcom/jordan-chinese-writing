<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8bd8ed">
<title>Jordan's 3× Block Builder</title>
<style>
:root{font-family:system-ui,"Trebuchet MS",sans-serif;color:#203b2a;background:#dff2b7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#9ce2f0 0 43%,#dff2b7 43% 70%,#8cc858 70%)}main{max-width:1020px;margin:auto;padding:clamp(12px,3vw,28px)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:1000}.brand{font-size:clamp(19px,4vw,30px)}.pill{background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap}h1{text-align:center;font-size:clamp(26px,5vw,46px);margin:9px 0 2px;text-shadow:2px 3px white}header+p{text-align:center;font-weight:700;margin:3px 0 16px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scene{height:380px;position:relative;overflow:hidden;border:5px solid white;border-radius:22px;background:linear-gradient(#8edcf0 0 65%,#8cc753 65%);box-shadow:0 7px #478247}.sun{position:absolute;right:10%;top:9%;width:48px;height:48px;border-radius:50%;background:#ffe475}.cloud{position:absolute;left:9%;top:8%;font-size:54px;color:white}.ground{position:absolute;bottom:0;height:28%;width:100%;border-top:5px solid #57933b;background:repeating-linear-gradient(90deg,#76bc4c 0 42px,#81c653 42px 84px)}.caption{position:absolute;top:10px;left:10px;padding:7px 10px;border-radius:10px;background:#fffd;font-weight:900;z-index:3}.roof{position:absolute;bottom:53%;left:50%;transform:translateX(-50%);width:min(67%,300px);height:88px;clip-path:polygon(50% 0,100% 100%,0 100%);background:repeating-linear-gradient(90deg,#914332 0 18px,#aa5038 18px 36px);filter:drop-shadow(0 4px #0003)}.house{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:min(63%,280px);height:145px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);z-index:2}.block{border:2px solid #0003;box-shadow:inset -5px -5px #0002,inset 4px 4px #fff3;animation:pop .35s cubic-bezier(.2,1.7,.4,1);background:repeating-linear-gradient(0deg,#bd8248 0 13px,#d39a5a 13px 26px)}.window{background:#7ad8e8;box-shadow:inset 0 0 0 5px #9e6339}.door{background:#704226;position:relative}.door:after{content:'▪';position:absolute;right:3px;top:36%;color:#ffd16d}.steve{position:absolute;left:5%;bottom:28%;z-index:3;font-size:clamp(45px,7vw,65px);filter:drop-shadow(3px 4px #0003);animation:bob 1.2s infinite alternate}.pick{position:absolute;right:-22px;top:-7px;font-size:30px}.crafting{position:absolute;bottom:28%;left:17%;z-index:1;background:repeating-linear-gradient(0deg,#9c623b 0 8px,#bb8050 8px 16px);border:3px solid #774626;width:45px;height:42px;box-shadow:inset 0 0 0 3px #0002}.panel{background:#fffef5;border:4px solid white;border-radius:22px;padding:clamp(15px,3vw,23px);box-shadow:0 7px #478247}.topline{display:flex;justify-content:space-between;font-weight:900}.track{height:15px;border-radius:99px;background:#dce7c8;overflow:hidden;margin:8px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#8bcf4d,#36a95e);transition:width .4s}.question{text-align:center;font-size:clamp(38px,7vw,55px);font-weight:1000;margin:14px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{font:inherit;font-size:clamp(22px,4vw,28px);font-weight:1000;color:#203b2a;background:#f2f8e8;border:3px solid #d4e4bf;border-radius:15px;padding:12px;min-height:62px;box-shadow:0 4px #c6d6af;touch-action:manipulation}.answer:active{transform:translateY(2px)}.answer:disabled{opacity:.9}.answer.ok{background:#baf0a2;border-color:#64b943}.answer.no{background:#ffd5c8;border-color:#e77c68}.feedback{min-height:30px;text-align:center;font-weight:900;font-size:17px;margin-top:5px}.hint{text-align:center;font-size:14px;color:#536d50;margin:5px 0}.actions{text-align:center;margin-top:13px}.restart{border:0;border-radius:99px;background:#387d43;color:white;padding:12px 22px;font:inherit;font-weight:900;font-size:17px;box-shadow:0 4px #285d32;touch-action:manipulation}.steve.build{animation:craft .55s ease}.shake{animation:shake .24s}@keyframes pop{from{transform:scale(.2);opacity:.3}to{transform:scale(1);opacity:1}}@keyframes bob{to{translate:0 -7px}}@keyframes craft{35%{transform:rotate(-20deg) translateY(-11px)}70%{transform:rotate(9deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:700px){.layout{grid-template-columns:1fr}.scene{height:290px}.house{height:120px}.roof{height:72px}.question{margin:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main>
<header><div class="brand">⛏️ BLOCK BUILDER</div><div class="pill">⭐ <span id="score">0</span> points</div></header>
<h1>Jordan's 3× House Challenge!</h1><p>Answer 10 questions. Every right answer helps Steve build!</p>
<section class="layout"><div class="scene" aria-label="Steve is building a block house"><div class="sun"></div><div class="cloud">☁</div><div class="caption"><span id="count">0</span>/10 blocks placed</div><div class="roof"></div><div class="house" id="house"></div><div class="crafting"></div><div class="steve" id="steve">🧑🏻‍🔧<span class="pick">⛏️</span></div><div class="ground"></div></div>
<div><div class="panel"><div class="topline"><span>Question <span id="num">1</span> of 10</span><span>🏠 <span id="percent">0</span>%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hint" id="hint">Pick the right answer to craft a block!</div></div><div class="actions"><button class="restart" id="restart">↻ Start over</button></div></div></section>
</main><script>
(()=>{let step=0,score=0,locked=false;const $=id=>document.getElementById(id);function choices(n){const s=new Set([3*n]);while(s.size<4){let v=Math.max(1,3*n+(Math.floor(Math.random()*9)-4)*3);if(Math.random()<.2)v=1+Math.floor(Math.random()*31);s.add(v)}return[...s].sort(()=>Math.random()-.5)}function draw(){locked=false;if(step===10){$('question').textContent='🏆';$('num').textContent='10';$('answers').innerHTML='';$('feedback').innerHTML='<strong>House complete! 🎉</strong> Jordan and Steve built it together!';$('hint').textContent='Amazing work — you know your 3 times table!';return}const n=step+1;$('num').textContent=n;$('question').textContent='3 × '+n+' = ?';$('feedback').textContent='';$('hint').textContent='Pick the right answer to craft a block!';$('answers').innerHTML='';choices(n).forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v,b,n);$('answers').appendChild(b)});$('bar').style.width=(step*10)+'%';$('percent').textContent=step*10}function answer(v,b,n){if(locked)return;if(v!==3*n){b.classList.add('no');$('feedback').textContent='Not quite — try another answer!';return}locked=true;score+=10;$('score').textContent=score;$('feedback').textContent='Correct! Steve crafted a block! ✨';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('ok');const s=$('steve');s.classList.remove('build');void s.offsetWidth;s.classList.add('build');setTimeout(()=>{const i=step,e=document.createElement('div');e.className='block';e.style.gridColumn=String(i%5+1);e.style.gridRow=String(2-Math.floor(i/5));if(i===1||i===3){e.className='block window'}if(i===7){e.className='block door'}$('house').appendChild(e);step++;$('count').textContent=step;$('bar').style.width=(step*10)+'%';$('percent').textContent=step*10;setTimeout(draw,550)},350)}$('restart').onclick=()=>{step=0;score=0;locked=false;$('score').textContent='0';$('count').textContent='0';$('house').innerHTML='';$('bar').style.width='0';$('percent').textContent='0';draw()};draw()})();
</script></body></html>
