<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#72c9f4">
<title>Jordan's 3× Minecraft Block Builder</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,"Trebuchet MS",sans-serif;color:#182b23;background:#a8df87;--grass:#62b94e;--dirt:#8c5a37;--stone:#858c91;--wood:#bd8549;--gold:#ffe27a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#72c9f4 0 44%,#b5e68b 44% 70%,#66b94c 70%);image-rendering:pixelated}button{font:inherit}main{max-width:1120px;margin:auto;padding:clamp(12px,3vw,28px)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:1000}.brand{font-size:clamp(17px,3.6vw,29px);text-shadow:2px 2px #fff}.back{color:inherit;text-decoration:none}.back:active{transform:translateY(2px);box-shadow:1px 1px #263d2b}.pill{background:#fff;border:3px solid #263d2b;border-radius:9px;padding:7px 12px;white-space:nowrap;box-shadow:3px 3px #263d2b;font-weight:1000}h1{text-align:center;font-size:clamp(25px,5vw,44px);line-height:1.12;margin:18px 0 5px;text-shadow:3px 3px #fff,-1px -1px #fff}header+p{text-align:center;font-weight:800;margin:7px 0 18px}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:17px;align-items:stretch}.scene{height:440px;position:relative;overflow:hidden;border:5px solid #fff;border-radius:12px;background:linear-gradient(#7bcff3 0 63%,#a8d86c 63%);box-shadow:0 7px #355e38;isolation:isolate}.sun{position:absolute;right:9%;top:8%;width:44px;height:44px;background:#ffe477;box-shadow:0 0 0 5px #fff7}.cloud{position:absolute;top:10%;left:10%;font-size:48px;color:white;text-shadow:3px 3px #b5e7f6}.farhill{position:absolute;bottom:31%;left:-5%;width:60%;height:100px;background:#82c66a;clip-path:polygon(0 100%,0 70%,25% 20%,40% 45%,64% 0,100% 100%);opacity:.8}.farhill.two{left:52%;width:60%;height:120px;opacity:.65}.ground{position:absolute;bottom:0;height:29%;width:100%;border-top:7px solid #438d36;background:repeating-linear-gradient(90deg,#73c34e 0 40px,#80cd57 40px 80px)}.dirtline{position:absolute;bottom:0;height:35px;width:100%;background:repeating-linear-gradient(90deg,#8a5a37 0 38px,#9a6941 38px 76px);border-top:4px solid #62442f}.caption{position:absolute;top:10px;left:10px;padding:8px 10px;background:#fff;border:3px solid #273d2c;border-radius:5px;font-weight:1000;z-index:8;box-shadow:3px 3px #273d2c}.house-wrap{position:absolute;bottom:29%;left:50%;transform:translateX(-50%);width:min(64%,310px);height:205px;z-index:2}.roof{position:absolute;top:0;left:0;width:100%;height:78px;background:repeating-linear-gradient(90deg,#713b2d 0 22px,#945039 22px 44px);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(3px 4px #0005)}.house{position:absolute;left:10%;bottom:0;width:80%;height:145px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);border:4px solid #62432e;background:#bd8549}.block{border:2px solid #0004;box-shadow:inset -5px -5px #0002,inset 4px 4px #fff3;background:repeating-linear-gradient(0deg,#b77b42 0 12px,#cd9355 12px 24px);animation:pop .35s steps(4)}.window{background:repeating-linear-gradient(90deg,#70d9f2 0 14px,#b9eff9 14px 17px);box-shadow:inset 0 0 0 4px #7e542f}.door{background:repeating-linear-gradient(90deg,#70442a 0 12px,#825232 12px 24px);position:relative}.door:after{content:"";position:absolute;right:4px;top:48%;width:5px;height:5px;background:#ffe27a}.steve{position:absolute;left:7%;bottom:28%;width:74px;height:125px;z-index:5;image-rendering:pixelated;animation:bob 1s steps(2) infinite alternate;transform-origin:bottom center}.head{position:absolute;top:0;left:18px;width:42px;height:42px;background:#c98a61;border:3px solid #604735;box-shadow:inset 0 -7px #b77753}.hair{position:absolute;top:-3px;left:-3px;width:42px;height:13px;background:#4b3027;border-bottom:4px solid #35241f}.eyes{position:absolute;top:18px;left:6px;width:6px;height:5px;background:#fff;box-shadow:19px 0 #fff}.eyes:after{content:"";position:absolute;left:2px;top:1px;width:4px;height:4px;background:#263b80;box-shadow:19px 0 #263b80}.beard{position:absolute;left:8px;bottom:2px;width:22px;height:7px;background:#64402d}.body{position:absolute;top:42px;left:13px;width:52px;height:43px;background:#3189c8;border:3px solid #24547d;box-shadow:inset 0 -6px #246da4}.arm{position:absolute;top:44px;left:2px;width:14px;height:42px;background:#c98a61;border:3px solid #604735;transform:rotate(9deg);transform-origin:top}.arm.right{left:60px;transform:rotate(-35deg)}.leg{position:absolute;top:81px;left:16px;width:19px;height:39px;background:#3a4d91;border:3px solid #26375f}.leg.right{left:39px}.boot{position:absolute;bottom:-2px;left:-3px;width:23px;height:9px;background:#593c2b}.pickaxe{position:absolute;right:-12px;top:24px;font-size:29px;filter:drop-shadow(2px 2px #0006);transform:rotate(-25deg)}.steve.build{animation:mine .55s steps(3)}.crafting{position:absolute;bottom:29%;left:20%;width:42px;height:40px;z-index:3;border:4px solid #68432a;background:repeating-linear-gradient(0deg,#986039 0 8px,#bd8549 8px 16px);box-shadow:inset 0 0 0 3px #0003}.ore{position:absolute;bottom:31%;right:9%;width:65px;height:53px;z-index:2;background:repeating-linear-gradient(0deg,#858c91 0 13px,#9da3a6 13px 26px);border:3px solid #5e666b;box-shadow:inset -6px -6px #0002}.ore:after{content:"";position:absolute;left:18px;top:9px;width:12px;height:12px;background:#f0cf58;box-shadow:19px 18px #f0cf58}.particle{position:absolute;z-index:9;font-size:21px;pointer-events:none;animation:fly .7s steps(4) forwards}.panel{background:#fffef2;border:4px solid #293d2d;border-radius:10px;padding:clamp(14px,2.5vw,22px);box-shadow:5px 6px #293d2d;display:flex;flex-direction:column}.topline{display:flex;justify-content:space-between;gap:8px;font-weight:1000}.track{height:15px;border:2px solid #293d2d;background:#dbe8cb;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:repeating-linear-gradient(90deg,#5bbf4c 0 16px,#80d564 16px 32px);transition:width .35s steps(5)}.question{text-align:center;font-size:clamp(39px,7vw,58px);font-weight:1000;margin:15px 0;text-shadow:2px 2px #d3e9c4}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{font-size:clamp(23px,4vw,30px);font-weight:1000;color:#203b2a;background:#eaf5dc;border:3px solid #537e43;border-radius:6px;padding:12px;min-height:62px;box-shadow:0 4px #537e43;touch-action:manipulation;cursor:pointer}.answer:active{transform:translateY(3px);box-shadow:0 1px #537e43}.answer:disabled{opacity:1}.answer.ok{background:#baf0a2;border-color:#2e873e}.answer.no{background:#ffd5c8;border-color:#bd4f3c}.feedback{min-height:34px;text-align:center;font-weight:1000;font-size:17px;margin-top:9px}.hint{text-align:center;font-size:14px;color:#536d50;margin:3px 0}.actions{text-align:center;margin-top:16px}.restart{border:3px solid #244e2b;border-radius:6px;background:#387d43;color:white;padding:11px 22px;font-weight:1000;font-size:17px;box-shadow:0 4px #244e2b;touch-action:manipulation;cursor:pointer}.restart:active{transform:translateY(3px);box-shadow:0 1px #244e2b}.spark{position:absolute;z-index:10;font-size:20px;animation:fly .65s steps(4) forwards;pointer-events:none}@keyframes pop{0%{transform:scale(.2);opacity:.2}100%{transform:scale(1);opacity:1}}@keyframes bob{to{transform:translateY(-5px)}}@keyframes mine{0%,100%{transform:rotate(0)}30%{transform:rotate(-15deg) translateY(-5px)}65%{transform:rotate(12deg)}}@keyframes fly{to{transform:translate(var(--dx,24px),-55px) rotate(90deg);opacity:0}}@media(max-width:720px){.layout{grid-template-columns:1fr}.scene{height:330px}.house-wrap{width:min(66%,300px);height:175px}.house{height:120px}.roof{height:65px}.steve{transform:scale(.86);transform-origin:bottom left;left:4%}.panel{padding:16px}.question{margin:10px 0}.answer{min-height:58px}}@media(orientation:landscape) and (max-height:600px){main{padding:8px 14px}.layout{grid-template-columns:1fr 1fr}.scene{height:calc(100vh - 155px);min-height:300px}.house-wrap{height:165px}.house{height:112px}.roof{height:62px}.panel{padding:12px}.question{margin:7px 0}.answer{min-height:48px;padding:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main>
<header><a class="pill back" href="jordan.html">← Jordan</a><div class="brand">⛏️ MINECRAFT · MATH QUEST</div><div class="pill">⭐ <span id="score">0</span> 分</div></header>
<p>答对三的乘法，帮 Steve 挖矿、收集方块，建造自己的小屋！</p>
<h1>Jordan 的三倍建造挑战</h1>
<section class="layout">
<div class="scene" id="scene" aria-label="像素风 Steve 正在建造房子">
<div class="sun"></div><div class="cloud">☁</div><div class="farhill"></div><div class="farhill two"></div>
<div class="caption">🏠 建造进度：<span id="count">0</span>/10</div>
<div class="house-wrap"><div class="roof"></div><div class="house" id="house"></div></div>
<div class="crafting"></div><div class="ore"></div>
<div class="steve" id="steve" aria-label="Steve 像素角色"><div class="head"><div class="hair"></div><div class="eyes"></div><div class="beard"></div></div><div class="body"></div><div class="arm"></div><div class="arm right"></div><div class="leg"><div class="boot"></div></div><div class="leg right"><div class="boot"></div></div><div class="pickaxe">⛏️</div></div>
<div class="ground"></div><div class="dirtline"></div>
</div>
<div><div class="panel"><div class="topline"><span>第 <span id="num">1</span>/10 题</span><span>🏡 <span id="percent">0</span>%</span></div><div class="track"><div class="bar" id="bar"></div></div><div class="question" id="question">3 × 1 = ?</div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="hint" id="hint">选对答案，Steve 就会挖矿并放下一块方块！</div></div><div class="actions"><button class="restart" id="restart">↻ 重新挑战</button></div></div>
</section></main>
<script>
(()=>{let step=0,score=0,locked=false;const $=id=>document.getElementById(id);
function choices(n){const s=new Set([3*n]);while(s.size<4){let v=Math.max(1,3*n+(Math.floor(Math.random()*9)-4)*3);if(Math.random()<.24)v=1+Math.floor(Math.random()*31);s.add(v)}return[...s].sort(()=>Math.random()-.5)}
function particles(){const scene=$('scene');for(let i=0;i<7;i++){const p=document.createElement('span');p.className='particle';p.textContent=['🟫','🟩','✨','🪨'][i%4];p.style.left=(12+Math.random()*76)+'%';p.style.bottom=(30+Math.random()*30)+'%';p.style.setProperty('--dx',(Math.random()*90-45)+'px');scene.appendChild(p);setTimeout(()=>p.remove(),750)}}
function draw(){locked=false;if(step===10){ $('question').textContent='🏆';$('num').textContent='10';$('answers').innerHTML='';$('feedback').innerHTML='<strong>任务完成！🎉</strong><br>Jordan 和 Steve 成功建好小屋！';$('hint').textContent='太棒了！你已经完成三的乘法挑战。';$('bar').style.width='100%';$('percent').textContent='100';return}
const n=step+1;$('num').textContent=n;$('question').textContent='3 × '+n+' = ?';$('feedback').textContent='';$('hint').textContent='选对答案，Steve 就会挖矿并放下一块方块！';$('answers').innerHTML='';
choices(n).forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v,b,n);$('answers').appendChild(b)});
$('bar').style.width=(step*10)+'%';$('percent').textContent=step*10}
function answer(v,b,n){if(locked)return;if(v!==3*n){b.classList.add('no');$('feedback').textContent='再试一次！想一想：3 × '+n+' 是多少？';$('scene').classList.remove('shake');void $('scene').offsetWidth;$('scene').classList.add('shake');return}
locked=true;score+=10;$('score').textContent=score;$('feedback').textContent='答对了！Steve 正在挖矿、制作方块！⛏️';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('ok');const s=$('steve');s.classList.remove('build');void s.offsetWidth;s.classList.add('build');particles();
setTimeout(()=>{const i=step,e=document.createElement('div');e.className='block';e.style.gridColumn=String(i%5+1);e.style.gridRow=String(2-Math.floor(i/5));if(i===1||i===3){e.className='block window'}if(i===7){e.className='block door'}$('house').appendChild(e);step++;$('count').textContent=step;$('bar').style.width=(step*10)+'%';$('percent').textContent=step*10;$('hint').textContent='方块放好了！继续回答下一题。';setTimeout(draw,650)},420)}
$('restart').onclick=()=>{step=0;score=0;locked=false;$('score').textContent='0';$('count').textContent='0';$('house').innerHTML='';$('bar').style.width='0';$('percent').textContent='0';draw()};draw()})();
</script></body></html>
