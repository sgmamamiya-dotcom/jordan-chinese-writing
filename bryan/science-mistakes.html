<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bryan's Science Mistakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="../hub.css">
<style>
[hidden]{display:none!important}
.wrap{max-width:820px}
h1{color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.filters button{font:700 15px var(--body);min-height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff}
.mq{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--ink);margin:0 0 22px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--mute);margin:0 0 6px}
.meta .done{color:#1f7a3f}
.mq h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 6px;line-height:1.2}
.mq .stem{font-size:18px;line-height:1.5;margin:0 0 12px}
.mq .stem b{background:#FFE08A;padding:0 4px;border-radius:4px}
.pic{margin:0 0 14px;background:#F7FAF7;border-radius:14px;padding:10px}
.pic svg{width:100%;height:auto;display:block}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:700 16px var(--body);min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid #d8dde4;background:#fff;color:var(--ink);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.opts button:disabled{cursor:default}
.opts .right{border-color:#1f7a3f;background:#E6F6EA}
.opts .wrong{border-color:#c0392b;background:#FCE9E7}
.fb{margin-top:14px;display:grid;gap:10px}
.fb div{border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.5}
.fb .verdict{font-weight:700;font-size:17px;padding:0}
.fb .why{background:#E6F6EA}
.fb .trap{background:#FCE9E7}
.fb .habit{background:#FFF7DD;border-left:6px solid var(--yellow);border-radius:0 12px 12px 0}
.fb .first{color:var(--mute);font-size:14px;padding:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{font:700 15px var(--body);min-height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.acts .ok{background:#1f7a3f;border-color:#1f7a3f;color:#fff}
.empty{color:var(--mute);font-size:17px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="science-mistakes.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  // Newest date first; same-day questions keep paper order.
  var M = window.SCI_MISTAKES.map(function (m, i) { return [m, i]; }).sort(function (x, y) { return x[0].date < y[0].date ? 1 : x[0].date > y[0].date ? -1 : x[1] - y[1]; }).map(function (x) { return x[0]; });
  var KEY = 'sci_mistakes_v1', FKEY = 'sci_mistakes_filter_v1';
  function read(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var state = read(KEY, {});
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function button(cls, text, fn) { var b = el('button', cls, text); b.type = 'button'; b.onclick = fn; return b; }

  // Simple drawings for questions with a diagram.
  var PICS = {
    plantStages:
      '<svg viewBox="0 0 520 190" role="img" aria-label="Four stages: A a seed, B a germinating seed, C a young plant with a flower, D a plant with a flower and a fruit">' +
      '<g stroke="#6b4f2a" stroke-width="2"><line x1="10" y1="120" x2="510" y2="120"/></g>' +
      // A seed
      '<ellipse cx="65" cy="138" rx="14" ry="10" fill="#c9a26b" stroke="#6b4f2a" stroke-width="2"/>' +
      // B germinating
      '<ellipse cx="190" cy="140" rx="13" ry="9" fill="#c9a26b" stroke="#6b4f2a" stroke-width="2"/>' +
      '<path d="M190 131 Q192 120 190 106" stroke="#2e8b3d" stroke-width="3" fill="none"/>' +
      '<path d="M190 149 Q188 158 192 168" stroke="#8a6a3a" stroke-width="2" fill="none"/>' +
      // C plant with flower
      '<path d="M320 120 L320 50" stroke="#2e8b3d" stroke-width="4"/>' +
      '<ellipse cx="305" cy="90" rx="14" ry="6" fill="#4caf50"/><ellipse cx="335" cy="76" rx="14" ry="6" fill="#4caf50"/>' +
      '<circle cx="320" cy="42" r="10" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/><circle cx="320" cy="42" r="3" fill="#ffd54f"/>' +
      '<path d="M320 120 L308 150 M320 120 L320 155 M320 120 L333 148" stroke="#8a6a3a" stroke-width="2"/>' +
      '<text x="340" y="46" font-size="13" fill="#c2185b" font-weight="700">flower</text>' +
      // D plant with flower and fruit
      '<path d="M450 120 L450 40" stroke="#2e8b3d" stroke-width="4"/>' +
      '<ellipse cx="435" cy="96" rx="14" ry="6" fill="#4caf50"/><ellipse cx="465" cy="64" rx="14" ry="6" fill="#4caf50"/>' +
      '<circle cx="450" cy="32" r="10" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/><circle cx="450" cy="32" r="3" fill="#ffd54f"/>' +
      '<ellipse cx="470" cy="84" rx="9" ry="13" fill="#ff9800" stroke="#e65100" stroke-width="2"/>' +
      '<text x="482" y="88" font-size="13" fill="#e65100" font-weight="700">fruit</text>' +
      '<path d="M450 120 L436 152 M450 120 L450 158 M450 120 L464 150" stroke="#8a6a3a" stroke-width="2"/>' +
      '<g font-size="18" font-weight="800" fill="#222" text-anchor="middle"><text x="65" y="185">A</text><text x="190" y="185">B</text><text x="320" y="185">C</text><text x="450" y="185">D</text></g>' +
      '</svg>'
  };

  function stem(text) {
    // Highlight NOT so it can't be missed.
    var p = el('p', 'stem');
    text.split(/(\bNOT\b)/).forEach(function (part) { p.appendChild(part === 'NOT' ? el('b', null, part) : document.createTextNode(part)); });
    return p;
  }

  function card(m) {
    var box = el('article', 'mq');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, m.date + ' · ' + m.source));
    var st = state[m.id];
    meta.appendChild(el('span', st && st.mastered ? 'done' : null, st && st.mastered ? '✓ Mastered' : 'To review'));
    box.appendChild(meta);
    box.appendChild(el('h2', null, m.topic));
    box.appendChild(stem(m.q));
    if (m.pic && PICS[m.pic]) { var pic = el('div', 'pic'); pic.innerHTML = PICS[m.pic]; box.appendChild(pic); }

    var opts = el('div', 'opts'), fb = el('div', 'fb'); fb.hidden = true;
    m.a.forEach(function (a, k) {
      var b = button(null, '(' + (k + 1) + ') ' + a, function () {
        Array.prototype.forEach.call(opts.children, function (o, j) { o.disabled = true; if (j === m.c) o.classList.add('right'); });
        if (k !== m.c) b.classList.add('wrong');
        fb.textContent = '';
        fb.appendChild(el('div', 'verdict', k === m.c ? '✓ Correct! Now say WHY out loud before reading on.' : '✗ Not yet. The answer is (' + (m.c + 1) + ').'));
        fb.appendChild(el('div', 'why', '✅ Why (' + (m.c + 1) + ') is right: ' + m.why));
        fb.appendChild(el('div', 'trap', '⚠️ The trap: ' + m.trap));
        fb.appendChild(el('div', 'habit', '🎯 Exam habit: ' + m.habit));
        fb.appendChild(el('div', 'first', 'First time on the paper, you chose (' + (m.was + 1) + ').'));
        var acts = el('div', 'acts');
        acts.appendChild(button(null, '↻ Try again', function () { box.replaceWith(card(m)); }));
        if (k === m.c) acts.appendChild(button('ok', st && st.mastered ? '↩ Move back to review' : '✓ I\'ve got it', function () {
          var s = state[m.id] || {}; s.mastered = !s.mastered; state[m.id] = s; write(KEY, state); render();
        }));
        fb.appendChild(acts);
        fb.hidden = false;
        var s = state[m.id] || {}; s.tries = (s.tries || 0) + 1; if (k === m.c) s.right = (s.right || 0) + 1; state[m.id] = s; write(KEY, state);
      });
      opts.appendChild(b);
    });
    box.appendChild(opts); box.appendChild(fb);
    return box;
  }

  function render() {
    var f = read(FKEY, 'review');
    app.textContent = '';
    var back = el('a', 'back', '← Science Lab'); back.href = 'science.html'; app.appendChild(back);
    app.appendChild(el('h1', null, '📒 Science Mistakes'));
    var todo = M.filter(function (m) { return !(state[m.id] && state[m.id].mastered); }).length;
    app.appendChild(el('p', 'hello', 'Questions you got wrong in school papers. Answer each one again, read the trap, then mark it "got it". ' + todo + ' left to review.'));
    var bar = el('div', 'filters');
    [['review', 'To review'], ['all', 'All']].forEach(function (x) {
      var b = button(null, x[1], function () { write(FKEY, x[0]); render(); });
      b.setAttribute('aria-pressed', x[0] === f ? 'true' : 'false'); bar.appendChild(b);
    });
    app.appendChild(bar);
    var list = M.filter(function (m) { return f === 'all' || !(state[m.id] && state[m.id].mastered); });
    if (!list.length) app.appendChild(el('p', 'empty', '🎉 All mastered! Tap "All" to look back.'));
    list.forEach(function (m) { app.appendChild(card(m)); });
  }
  render();
})();
</script>
</body>
</html>
