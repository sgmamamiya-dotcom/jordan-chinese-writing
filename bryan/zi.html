<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>必考字练习</title>
<style>
:root{
  --bg:#F1F5F3;--card:#FFFFFF;--ink:#17233C;--mute:#566275;--line:#D5DDE3;
  --accent:#1F7A67;--on-accent:#FFFFFF;--ok:#1B7F45;--okbg:#E3F3EA;
  --bad:#C0334A;--badbg:#FBE7EA;--gold:#E0A526;--grid:#8DBFB0;--chip:#EAF0EE;
  --kai:"KaiTi","Kaiti SC","STKaiti","DFKai-SB","Noto Serif SC","Songti SC",serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0F1720;--card:#18232F;--ink:#E8EEF3;--mute:#9AA8B8;--line:#2C3A49;
  --accent:#4CC2A3;--on-accent:#0F1720;--ok:#5BD08A;--okbg:#17352A;
  --bad:#FF8494;--badbg:#3A1E25;--grid:#3F6F63;--chip:#223140;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:.02em}
.sub{margin:0 0 18px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}

/* home */
.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"dn dr ds" "dc dc dc";gap:2px 10px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.day .dn{grid-area:dn;font-weight:700}
.day .dr{grid-area:dr;color:var(--mute);font-size:14px;align-self:center}
.day .ds{grid-area:ds;font-size:14px;color:var(--ok);font-weight:600}
.day .dc{grid-area:dc;font-family:var(--kai);font-size:22px;letter-spacing:.12em;margin-top:4px;word-break:break-all}
.day.next{border:2px solid var(--accent)}
.day.next .ds{color:var(--accent)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:10px 0;display:block;margin:6px auto 0}

/* bars */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mute);font-size:14px}
.back{background:none;border:0;padding:6px 8px 6px 0;color:var(--ink);font-size:15px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

/* 田字格 */
.tzg{position:relative;width:min(68vw,236px);aspect-ratio:1;margin:0 auto 12px;border:2px solid var(--grid);background:var(--card)}
.tzg::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--grid)}
.tzg::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1.5px dashed var(--grid)}
.tzg .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--kai);
  font-size:min(44vw,152px);line-height:1;color:var(--ink);z-index:1;user-select:none}
.tzg .g.trace{opacity:.14}
.tzg .g.blank{opacity:0}
.tzg canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}
.seg{display:flex;justify-content:center;gap:6px;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mute)}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg .clr{border-style:dashed;margin-left:6px}
.py{display:flex;justify-content:center;align-items:center;gap:8px;font-size:26px;font-weight:600}
.spk{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;font-size:18px;line-height:1}
.src{text-align:center;color:var(--mute);font-size:13px;margin:2px 0 12px}
.learn h3{font-size:14px;color:var(--mute);margin:14px 0 4px;font-weight:600}
.learn p{margin:0 0 4px}
.en{color:var(--mute);font-size:14px}
mark{background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:8px;padding:2px 10px;font-size:16px}
.chip.ch{font-family:var(--kai);font-size:20px}
.row{margin:4px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row b{font-size:13px;color:var(--mute);font-weight:600;min-width:2.5em}
.note{margin-top:12px;border-left:4px solid var(--gold);background:var(--chip);padding:8px 12px;border-radius:0 10px 10px 0;font-size:15px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}

/* quiz */
.q{text-align:center}
.tag{display:inline-block;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin-bottom:10px}
.qchar{font-family:var(--kai);font-size:92px;line-height:1.1}
.qt{margin:6px 0;color:var(--mute)}
.qdef{font-size:20px;font-weight:600;margin:6px 0 2px}
.qen{color:var(--mute);margin:0 0 8px}
.qs{font-size:21px;line-height:1.7;margin:8px 0 14px;text-align:left}
.qword{font-size:34px;font-family:var(--kai);margin:6px 0 14px;letter-spacing:.1em}
.blank{display:inline-block;min-width:1.2em;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:22px}
.opts.ch .opt{font-family:var(--kai);font-size:36px;padding:10px 8px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;text-align:left;border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb .ex{display:block;margin-top:4px;font-size:15px}
.fb .btn{margin-top:12px}

/* result */
.res{text-align:center}
.stars{font-size:40px;letter-spacing:.1em;color:var(--gold)}
.score{font-size:44px;font-weight:700;margin:0}
.miss{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.mc{background:var(--chip);border-radius:12px;padding:6px 12px;text-align:center}
.mc span{display:block;font-family:var(--kai);font-size:34px;line-height:1.2}
.mc small{color:var(--mute)}
.wl{display:grid;gap:8px;margin:12px 0}
.wi{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wi .c{font-family:var(--kai);font-size:38px;line-height:1}
.empty{color:var(--mute);text-align:center;padding:24px 0}
@media(prefers-reduced-motion:no-preference){.opt,.btn,.day{transition:background .15s,border-color .15s}}
</style>
</head>

  return mem || { done: {}, wrong: {}, stats: {} };
}
function save() { mem = state; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const strip = s => s.replace(/[(（][^)）]*[)）]/g, '').trim();
const base = p => p.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const hl = (s, ch) => esc(s).split(ch).join('<mark>' + ch + '</mark>');
const today = () => new Date().toISOString().slice(0, 10);
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = .8; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function render(h) { app.innerHTML = h; try { window.scrollTo(0, 0); } catch (e) {} }

/* ---------- question generation ---------- */
function distChars(c, k = 3) {
  const pool = [...new Set([...c.shape, ...c.sound])].filter(x => /^[\u4e00-\u9fff]$/.test(x) && x !== c.ch);
  let out = shuffle(pool).slice(0, k);
  if (out.length < k) {
    const rest = shuffle(CH.map(x => x.ch).filter(x => x !== c.ch && !out.includes(x)));
    out = out.concat(rest.slice(0, k - out.length));
  }
  return out;
}
function distPy(c, k = 3) {
  const all = [...new Set(CH.map(x => x.py))].filter(p => p !== c.py);
  const b = base(c.py);
  const same = shuffle(all.filter(p => base(p) === b));
  const near = shuffle(all.filter(p => base(p) !== b && base(p)[0] === b[0]));
  const rest = shuffle(all.filter(p => base(p)[0] !== b[0]));
  return [...same, ...near, ...rest].slice(0, k);
}
function qPinyin(c) {
  return { c, type: '读音', kind: 'py', ans: c.py, opts: shuffle([c.py, ...distPy(c)]),
    prompt: `<div class="qchar">${c.ch}</div><p class="qt">这个字怎么读？</p>` };
}
function qMeaning(c) {
  return { c, type: '字义', kind: 'ch', ans: c.ch, opts: shuffle([c.ch, ...distChars(c)]),
    prompt: `<p class="qt">哪个字的意思是：</p><p class="qdef">${esc(c.def)}</p><p class="qen">${esc(c.en)}</p>` };
}
function qSentence(c) {
  const ex = shuffle(c.ex).find(e => e.includes(c.ch));
  if (!ex) return null;
  const s = esc(ex).split(c.ch).join('<span class="blank">＿</span>');
  return { c, type: '例句', kind: 'ch', ans: c.ch, opts: shuffle([c.ch, ...distChars(c)]),
    prompt: `<p class="qt">选出适合的字：</p><p class="qs">${s}</p>` };
}
function qWord(c) {
  const ws = c.words.map(strip).filter(w => w.length >= 2 && w.includes(c.ch));
  if (!ws.length) return null;
  const s = esc(pick(ws)).split(c.ch).join('<span class="blank">＿</span>');
  return { c, type: '词语', kind: 'ch', ans: c.ch, opts: shuffle([c.ch, ...distChars(c)]),
    prompt: `<p class="qt">补全词语（${esc(c.en)}）</p><p class="qword">${s}</p>` };
}
function makeQ(c, used = []) {
  const bs = shuffle([qPinyin, qMeaning, qSentence, qWord]);
  for (const b of bs) { const q = b(c); if (q && !used.includes(q.type)) return q; }
  return qPinyin(c);
}

/* ---------- screens ---------- */
let L = null, Q = null;

function home() {
  const wrongN = Object.keys(state.wrong).length;
  const doneN = Object.keys(state.done).length;
  const next = days.findIndex((_, i) => !state.done[i]);
  const learned = days.flatMap((d, i) => state.done[i] ? d : []);
  render(`
    <h1>必考字练习</h1>
    <p class="sub">第${CH[0].n}–${CH[CH.length - 1].n}字，每天${DAYSIZE}个字。已完成 ${doneN}/${days.length} 天</p>
    <div class="days">${days.map((d, i) => {
      const dn = state.done[i];
      const st = dn ? `✓ ${dn.score}分` : (next === i ? '今天学这个' : '');
      return `<button class="day ${next === i ? 'next' : ''}" data-act="day" data-i="${i}">
        <span class="dn">第${i + 1}天</span><span class="dr">${d[0].n}–${d[d.length - 1].n}</span><span class="ds">${st}</span>
        <span class="dc">${d.map(c => c.ch).join('')}</span></button>`;
    }).join('')}</div>
    <div class="tools">
      <button class="btn sec" data-act="wrongbook" ${wrongN ? '' : 'disabled'}>错字本（${wrongN}）</button>
      <button class="btn sec" data-act="random" ${learned.length ? '' : 'disabled'}>随机测验</button>
    </div>
    <button class="link" data-act="reset">清除学习记录</button>`);
}

function learn() {
  const day = days[L.d], c = day[L.i], n = day.length;
  const chips = (arr, cls = '') => arr.map(x => `<span class="chip ${cls}">${esc(x)}</span>`).join('');
  render(`
    <div class="bar"><button class="back" data-act="home">‹ 返回</button><span>第${L.d + 1}天 · ${L.i + 1}/${n}</span></div>
    <section class="card learn">
      <div class="tzg"><div class="g ${L.m}" id="g">${c.ch}</div><canvas id="cv"></canvas></div>
      <div class="seg" role="group" aria-label="写字模式">写一写
        ${[['show', '看'], ['trace', '描'], ['blank', '默']].map(([m, t]) => `<button data-act="wmode" data-m="${m}" class="${L.m === m ? 'on' : ''}">${t}</button>`).join('')}
        <button class="clr" data-act="clear">擦掉</button></div>
      <div class="py"><span>${c.py}</span><button class="spk" data-act="speak" aria-label="朗读">🔊</button></div>
      <p class="src">${c.src ? esc(c.src) : '课文出处待补'}</p>
      <h3>意思</h3><p>${esc(c.def)}<br><span class="en">${esc(c.en)}</span></p>
      <h3>例句</h3>${c.ex.map(e => `<p>${hl(e, c.ch)}</p>`).join('')}
      <h3>词语</h3><div class="chips">${chips(c.words)}</div>
      <h3>容易混淆</h3>
      <div class="row"><b>形似</b>${chips(c.shape, 'ch')}</div>
      <div class="row"><b>音似</b>${chips(c.sound, 'ch')}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
      <div class="nav">
        <button class="btn sec" data-act="prev" ${L.i === 0 ? 'disabled' : ''}>上一个</button>
        <button class="btn" data-act="next">${L.i === n - 1 ? '开始练习' : '下一个'}</button>
      </div>
    </section>`);
  setupCanvas();
}

function setupCanvas() {
  const cv = $('#cv'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = Math.max(5, r.width / 24);
  x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1F7A67';
  let down = false, lx = 0, ly = 0;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { down = true; [lx, ly] = pt(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} x.beginPath(); x.moveTo(lx, ly); x.lineTo(lx + .01, ly); x.stroke(); };
  cv.onpointermove = e => { if (!down) return; const [p, q] = pt(e); x.beginPath(); x.moveTo(lx, ly); x.lineTo(p, q); x.stroke(); lx = p; ly = q; };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
}
function clearCanvas() {
  const cv = $('#cv'); if (!cv) return;
  const x = cv.getContext('2d'); x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height); x.restore();
}

/* ---------- quiz ---------- */
function startQuiz(o) {
  const items = (o.review || []).map(c => ({ q: makeQ(c), review: true }));
  let main = [];
  o.chars.forEach(c => { const used = []; for (let k = 0; k < o.per; k++) { const q = makeQ(c, used); used.push(q.type); main.push({ q, review: false }); } });
  const queue = [...items, ...shuffle(main)];
  Q = { o, queue, i: 0, ok: 0, first: queue.length, missed: [], answered: false };
  quiz();
}
function beginDay(d) {
  const chars = days[d];
  const review = Object.keys(state.wrong).map(Number).filter(n => !chars.some(c => c.n === n)).slice(0, 5).map(n => BY[n]);
  startQuiz({ mode: 'day', d, chars, review, per: 2 });
}
function quiz() {
  const it = Q.queue[Q.i], q = it.q; Q.answered = false;
  const tag = it.review ? '复习' : it.retry ? '再试一次' : q.type;
  render(`
    <div class="bar"><button class="back" data-act="home">‹ 退出</button><span>${Q.i + 1}/${Q.queue.length}</span></div>
    <div class="prog"><i style="width:${Q.i / Q.queue.length * 100}%"></i></div>
    <section class="card q"><span class="tag">${tag}</span>${q.prompt}
      <div class="opts ${q.kind}">${q.opts.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></section>`);
}
function answer(idx) {
  if (Q.answered) return; Q.answered = true;
  const it = Q.queue[Q.i], q = it.q, c = q.c;
  const right = q.opts[idx] === q.ans;
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, i) => { b.disabled = true; b.style.opacity = 1; if (q.opts[i] === q.ans) b.classList.add('ok'); else if (i === idx) b.classList.add('bad'); });
  if (!it.retry) {
    const st = state.stats[c.n] || (state.stats[c.n] = { ok: 0, bad: 0 });
    if (right) { Q.ok++; st.ok++; if (state.wrong[c.n]) { state.wrong[c.n]--; if (state.wrong[c.n] <= 0) delete state.wrong[c.n]; } }
    else { st.bad++; state.wrong[c.n] = 2; if (!Q.missed.includes(c.n)) Q.missed.push(c.n); }
  }
  if (!right && (it.tries || 0) < 2) Q.queue.push({ q: makeQ(c, [q.type]), review: false, retry: true, tries: (it.tries || 0) + 1 });
  save();
  const last = Q.i + 1 >= Q.queue.length;
  $('#fb').innerHTML = `<div class="fb ${right ? 'ok' : 'bad'}">
    <div class="h">${right ? '答对了' : '正确答案：' + esc(q.ans)}</div>
    <div><b style="font-family:var(--kai);font-size:20px">${c.ch}</b> ${c.py}　${esc(c.def)}</div>
    <span class="ex">${hl(c.ex[0], c.ch)}</span>
    <button class="btn" data-act="nextq">${last ? '看结果' : '下一题'}</button></div>`;
  $('#fb .btn').focus();
}
function finish() {
  const pct = Q.first ? Math.round(Q.ok / Q.first * 100) : 0;
  if (Q.o.mode === 'day') {
    const prev = state.done[Q.o.d];
    state.done[Q.o.d] = { date: today(), score: Math.max(pct, prev ? prev.score : 0) }; save();
  }
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
  render(`
    <section class="card res">
      <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p class="score">${pct}分</p>
      <p class="qt">一次答对 ${Q.ok}/${Q.first} 题</p>
      ${Q.missed.length ? `<p>这些字加入了错字本，明天会再复习：</p>
        <div class="miss">${Q.missed.map(n => { const c = BY[n]; return `<div class="mc"><span>${c.ch}</span><small>${c.py}</small></div>`; }).join('')}</div>`
        : '<p>全部一次答对，太棒了！</p>'}
      <div class="tools"><button class="btn sec" data-act="again">再练一遍</button><button class="btn" data-act="home">回首页</button></div>
    </section>`);
}
function wrongBook() {
  const ns = Object.keys(state.wrong).map(Number);
  render(`
    <div class="bar"><button class="back" data-act="home">‹ 返回</button><span>错字本</span></div>
    ${ns.length ? `<div class="wl">${ns.map(n => { const c = BY[n]; return `<div class="wi"><span class="c">${c.ch}</span><div><b>${c.py}</b>　<span class="en">${esc(c.en)}</span><br>${esc(c.def)}</div></div>`; }).join('')}</div>
      <button class="btn" data-act="wrongquiz">复习这些字</button>`
      : '<p class="empty">错字本是空的。</p>'}`);
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'home' || a === 'exit') home();
  else if (a === 'day') { L = { d: +b.dataset.i, i: 0, m: 'show' }; learn(); }
  else if (a === 'prev') { L.i--; learn(); }
  else if (a === 'next') { if (L.i < days[L.d].length - 1) { L.i++; learn(); } else beginDay(L.d); }
  else if (a === 'speak') speak(days[L.d][L.i].ch);
  else if (a === 'wmode') {
    L.m = b.dataset.m; $('#g').className = 'g ' + L.m;
    document.querySelectorAll('[data-act=wmode]').forEach(x => x.classList.toggle('on', x === b));
  }
  else if (a === 'clear') clearCanvas();
  else if (a === 'opt') answer(+b.dataset.i);
  else if (a === 'nextq') { Q.i++; if (Q.i >= Q.queue.length) finish(); else quiz(); }
  else if (a === 'again') startQuiz(Q.o.mode === 'day' ? Q.o : Q.o.redo ? Q.o.redo() : Q.o);
  else if (a === 'wrongbook') wrongBook();
  else if (a === 'wrongquiz') startQuiz({ mode: 'wrong', chars: shuffle(Object.keys(state.wrong).map(Number)).slice(0, 10).map(n => BY[n]), review: [], per: 1 });
  else if (a === 'random') {
    const pool = days.flatMap((d, i) => state.done[i] ? d : []);
    const o = { mode: 'random', chars: shuffle(pool).slice(0, 10), review: [], per: 1 };
    o.redo = () => ({ ...o, chars: shuffle(pool).slice(0, 10) });
    startQuiz(o);
  }
  else if (a === 'reset') { if (confirm('确定清除所有学习记录和错字本吗？')) { state = { done: {}, wrong: {}, stats: {} }; save(); home(); } }
});
home();
</script>
</body>
</html>
