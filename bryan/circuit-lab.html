<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circuit Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="../hub.css">
<style>
[hidden]{display:none!important}
.wrap{max-width:820px}
.lead{color:var(--mute);margin:0 0 18px}
.chapter{font-family:var(--display);font-weight:800;font-size:22px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.lv{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:grid;gap:2px}
.lv:hover{transform:translateY(2px);box-shadow:0 4px 0 var(--ink)}
.lv .n{font-weight:700;font-size:13px;color:var(--mute)}
.lv b{font-family:var(--display);font-size:19px;line-height:1.15}
.lv .st{color:#E0A526;letter-spacing:2px;font-size:15px}
.lv .st .off{color:#D8D2EA}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.back{background:none;border:0;font:inherit;padding:0;cursor:pointer}
.tag{display:inline-block;font-weight:700;font-size:13px;color:#fff;background:#0F766E;border-radius:999px;padding:2px 10px}
.tag.t2{background:#B45309}.tag.t3{background:#7A4CE0}.tag.t4{background:#CF3F3F}.tag.t5{background:#2A6FC9}
h1.lt{font-size:clamp(26px,5vw,36px);margin:6px 0 4px}
.mission{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;margin:10px 0 12px;font-size:17px}
.mission b{font-family:var(--display)}
.board{background:#FBFAFF;border:3px solid var(--ink);border-radius:20px;overflow:hidden;touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;max-height:62vh}
.slot{cursor:pointer}
.slot:hover .hl{stroke:#C4B5FD}
.flow{stroke:#FFC93C;stroke-width:4;stroke-dasharray:3 12;stroke-linecap:round;fill:none;animation:run linear infinite}
@keyframes run{to{stroke-dashoffset:-30}}
@media(prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none;opacity:.6}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tool{font:700 15px var(--body);min-height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.tool[aria-pressed=true]{background:var(--ink);color:#fff}
.tool .c{font-size:12px;background:#EFE9FF;color:var(--ink);border-radius:999px;padding:0 7px}
.tool:disabled{opacity:.4;cursor:default}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px;border:2px solid var(--ink);background:#fff}
.pill.on{background:#FFF3BF}.pill.dim{background:#FFF9E3}.pill.off{background:#EEE;color:#666}.pill.warn{background:#FBE7E7;border-color:#CF3F3F;color:#9B1C1C}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{font:700 16px var(--body);min-height:48px;padding:0 20px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.btn.go{background:var(--yellow)}
.btn:disabled{opacity:.45;cursor:default}
.fb{border-radius:16px;padding:12px 16px;margin:10px 0;font-size:16px;background:#F4F1FF}
.fb.good{background:#E5F5EA}.fb.bad{background:#FBE7E7}
.fb h3{font-family:var(--display);margin:0 0 4px;font-size:20px}
.hint{background:#FFF6D6;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{font:700 15px var(--body);min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.chip[aria-pressed=true]{background:#0F766E;border-color:#0F766E;color:#fff}
.chip.right{background:#2E8B57;border-color:#2E8B57;color:#fff}
.chip.wrong{background:#CF3F3F;border-color:#CF3F3F;color:#fff}
.answer{min-height:52px;border:2px dashed #B9B0DA;border-radius:14px;padding:10px 12px;background:#fff;font-size:16px}
.answer .ph{color:var(--mute)}
table.res{border-collapse:collapse;width:100%;font-size:15px;background:#fff;margin:8px 0}
table.res td,table.res th{border:1px solid #DCD5F2;padding:6px 8px;text-align:left}
.stars{font-size:28px;color:#E0A526;letter-spacing:4px}
.stars .off{color:#D8D2EA}
.cloud{color:var(--mute);font-size:13px;text-align:center;margin-top:24px}
.key{font-size:14px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../progress.js"></script>
<script>
(function () {
  'use strict';
  /* ================= physics =================
     Nodes sit on a grid; each edge between two neighbouring nodes can hold one part.
     The circuit is solved with nodal analysis (simple classroom model):
     wire and closed switch 0.01 ohm, bulb 1 ohm, cell 1.5 V with 0.1 ohm inside, materials as listed. */
  var V = 1.5, RIN = 0.1, PBASE = Math.pow(V / (RIN + 1), 2); // one cell + one bulb = brightness 1
  var MAT = {
    key: ['🔑', 'iron key', 50], coin: ['🪙', 'copper coin', 50], spoon: ['🥄', 'steel spoon', 50], foil: ['🧻', 'aluminium foil', 50],
    pencil: ['✏️', 'pencil lead (graphite)', 0.8], ruler: ['📏', 'plastic ruler', 0], eraser: ['🧽', 'rubber eraser', 0],
    wood: ['🪵', 'wooden stick', 0], string: ['🧵', 'cotton string', 0], glass: ['🥛', 'glass rod', 0]
  };
  function ends(key, C) {
    var p = key.slice(1).split(',').map(Number), c = p[0], r = p[1];
    return [r * C + c, key[0] === 'h' ? r * C + c + 1 : (r + 1) * C + c];
  }
  function solve(G, J) {
    var n = J.length, A = G.map(function (row, i) { return row.concat([J[i]]); });
    for (var i = 0; i < n; i++) {
      var p = i; for (var k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[p][i])) p = k;
      var t = A[i]; A[i] = A[p]; A[p] = t;
      for (k = i + 1; k < n; k++) { var f = A[k][i] / A[i][i]; if (!f) continue; for (var j = i; j <= n; j++) A[k][j] -= f * A[i][j]; }
    }
    var v = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = A[i][n]; for (j = i + 1; j < n; j++) s -= A[i][j] * v[j]; v[i] = s / A[i][i]; }
    return v;
  }
  function conductance(p) {
    if (p.t === 'wire') return 100;
    if (p.t === 'switch') return p.open ? 0 : 100;
    if (p.t === 'bulb') return p.blown ? 0 : 1;
    if (p.t === 'mat' || p.t === 'clip') return p.mat ? MAT[p.mat][2] : 0;
    if (p.t === 'battery') return 1 / RIN;
    return 0;
  }
  // Returns current (a -> b) for every part, brightness for bulbs, and whether there is a short circuit.
  function simulate(parts, C, R) {
    var n = C * R, G = [], J = [], i;
    for (i = 0; i < n; i++) { G.push(new Array(n).fill(0)); J.push(0); G[i][i] = 1e-6; }
    Object.keys(parts).forEach(function (k) {
      var p = parts[k], g = conductance(p); if (!g) return;
      var e = ends(k, C), a = e[0], b = e[1];
      G[a][a] += g; G[b][b] += g; G[a][b] -= g; G[b][a] -= g;
      if (p.t === 'battery') { var s = (p.dir || 1) * V * g; J[b] += s; J[a] -= s; }
    });
    var v = solve(G, J), out = { cur: {}, bright: {}, short: false };
    Object.keys(parts).forEach(function (k) {
      var p = parts[k], g = conductance(p), e = ends(k, C), I = 0;
      if (g) I = p.t === 'battery' ? (p.dir || 1) * V * g - (v[e[1]] - v[e[0]]) * g : (v[e[0]] - v[e[1]]) * g;
      out.cur[k] = I;
      if (p.t === 'bulb') out.bright[k] = p.blown ? 0 : I * I / PBASE;
      if (p.t === 'battery' && Math.abs(I) > 5) out.short = true;
    });
    return out;
  }

  /* ================= levels ================= */
  // parts: [edge, type, options]. Edges: 'h c,r' joins node (c,r) to (c+1,r); 'v c,r' joins (c,r) to (c,r+1).
  // Cells: dir 1 puts + at the right/bottom end, -1 at the left/top end.
  function P(e, t, o) { var p = { e: e, t: t, lock: true }; for (var k in o || {}) p[k] = o[k]; return p; }
  var L = [
    { ch: 'Closed circuits', id: 'c1', type: 'build', title: 'Light it up', grid: [4, 2],
      text: 'The bulb is not lit. Add wires to make a complete loop so bulb A lights up.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v3,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire')],
      tools: { wire: 3 },
      goal: function (T) { return T().lit('A') ? '' : 'Bulb A is still not lit. Is there a complete path from the + end, through the bulb, back to the − end?'; },
      hints: ['Electric current only flows in a closed circuit: a complete loop with no gaps.', 'Look at the bottom row. Is there a path from the bulb back to the cell?', 'Choose Wire and tap all three empty gaps on the bottom row.'],
      learn: 'A bulb lights up only when it is part of a closed circuit: an unbroken path from one end of the cell, through the bulb, back to the other end.' },
    { ch: 'Closed circuits', id: 'c2', type: 'fix', title: 'Something is in the way', grid: [4, 2],
      text: 'All the wires are joined, but bulb A will not light up. Find the problem and fix it.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v3,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'mat', { mat: 'ruler', lock: false }), P('h2,1', 'wire')],
      tools: { wire: 1, erase: true },
      goal: function (T) { return T().lit('A') ? '' : 'Bulb A is still not lit.'; },
      hints: ['Not everything lets electricity pass through.', 'Look at the plastic ruler on the bottom row. Plastic is an electrical insulator.', 'Use the Eraser to take away the ruler, then put a wire in the gap.'],
      learn: 'Plastic is an electrical insulator: it does not allow electricity to pass through, so the circuit was an open circuit.' },
    { ch: 'Conductors and insulators', id: 'm1', type: 'sort', title: 'Test the materials', grid: [4, 2],
      text: 'Put each object into the gap (the clip) and see if bulb A lights up. Test every object, then answer the question.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v3,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'clip', { mat: null }), P('h2,1', 'wire')],
      mats: ['key', 'ruler', 'coin', 'pencil', 'eraser', 'spoon', 'wood', 'foil'],
      hints: ['If the bulb lights up when an object is in the clip, the object lets electricity flow through it.', 'Metals are good electrical conductors. Watch the pencil lead carefully: the bulb is dim, but it is still lit.', 'Conductors: iron key, copper coin, pencil lead (graphite), steel spoon, aluminium foil.'],
      learn: 'Electrical conductors (metals, and graphite in pencil lead) allow electricity to flow through them. Electrical insulators (plastic, rubber, wood) do not.' },
    { ch: 'Switches', id: 's1', type: 'build', title: 'Add a switch', grid: [4, 2],
      text: 'Put a switch in the gap so that the switch can turn bulb A on and off.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v3,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,1', 'wire'), P('h2,1', 'wire')],
      tools: { wire: 1, switch: 1, erase: true },
      goal: function (T) {
        var sw = T.switches(); if (!sw.length) return 'There is no switch, so the bulb can never be turned off.';
        if (!T({ all: 'closed' }).lit('A')) return 'With the switch closed, bulb A should light up.';
        if (T({ all: 'open' }).lit('A')) return 'With the switch open, bulb A should go off.';
        return '';
      },
      hints: ['A switch opens and closes a gap in the circuit.', 'The gap is on the bottom row. A wire there would keep the bulb on all the time.', 'Choose Switch, tap the gap, then tap the switch to open and close it.'],
      learn: 'An open switch makes a gap, so the circuit becomes an open circuit and the bulb goes off. A closed switch completes the circuit.' },
    { ch: 'Cells and brightness', id: 'b1', type: 'build', title: 'Make it brighter', grid: [5, 2],
      text: 'Use two cells to make bulb A brighter than with one cell.',
      parts: [P('v4,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h3,0', 'wire'), P('v0,0', 'wire'), P('h0,1', 'wire'), P('h3,1', 'wire')],
      tools: { battery: 2, erase: true },
      goal: function (T) {
        var r = T(); if (r.short) return 'Short circuit!';
        if (r.bright('A') > 1.6) return '';
        if (r.lit('A')) return 'Bulb A is lit, but only as bright as with one cell. Are both cells working together?';
        return 'Bulb A is not lit. Check that the cells fill both gaps and face the same way (+ next to −).';
      },
      hints: ['Put the cells one after the other (in series) in the two gaps.', 'Cells must face the same way: the + end of one cell touches the − end of the next.', 'Tap a cell again to turn it around.'],
      learn: 'More cells in series (facing the same way) give a bigger push, so more current flows and the bulb is brighter. Cells facing opposite ways cancel each other out.' },
    { ch: 'Cells and brightness', id: 'b2', type: 'predict', title: 'Which way round?', grid: [5, 2],
      parts: [P('v4,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h3,0', 'wire'), P('v0,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'battery', { dir: 1, name: 'Cell 1' }), P('h2,1', 'battery', { dir: -1, name: 'Cell 2' }), P('h3,1', 'wire')],
      steps: [
        { q: 'Look at the + ends of Cell 1 and Cell 2. Will bulb A light up?', act: {} },
        { q: 'Now Cell 2 is turned around. Will bulb A light up?', act: { flip: ['Cell 2'] } }
      ],
      learn: 'Two cells facing opposite ways push current in opposite directions and cancel out, so no current flows. Facing the same way, they push together and the bulb is brighter.' },
    { ch: 'Series and parallel', id: 'p1', type: 'predict', title: 'Bulbs in a line', grid: [4, 2],
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('h0,0', 'wire'), P('h1,0', 'bulb', { name: 'A' }), P('h2,0', 'bulb', { name: 'B' }), P('v3,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'switch', { name: 'S', open: true }), P('h2,1', 'wire')],
      steps: [
        { q: 'Switch S is going to be closed. Which bulbs will light up?', act: { close: ['S'] } },
        { q: 'Bulb A fuses (its filament breaks). Which bulbs will light up now?', act: { blow: ['A'] } }
      ],
      learn: 'Bulbs A and B are in series: there is only one path for the current. Both are dimmer than one bulb alone, and if one bulb fuses the circuit is broken, so the other goes off too.' },
    { ch: 'Series and parallel', id: 'p2', type: 'build', title: 'Two bright bulbs', grid: [4, 3],
      text: 'Use two bulbs and two wires so that both bulbs light up as brightly as one bulb on its own.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v0,1', 'wire'), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,2', 'wire'), P('h1,2', 'wire'), P('h2,2', 'wire')],
      tools: { bulb: 2, wire: 2, erase: true },
      goal: function (T) {
        var r = T(), b = r.bulbs();
        if (r.short) return 'Short circuit! A wire is joining the top and bottom directly.';
        if (b.length < 2) return 'Use both bulbs.';
        var lit = b.filter(function (k) { return r.brightOf(k) > 0.05; });
        if (lit.length < 2) return 'Both bulbs must light up.';
        if (b.some(function (k) { return r.brightOf(k) < 0.6; })) return 'Both bulbs light up, but they are dim. Are they in series (one after the other)?';
        return '';
      },
      hints: ['If the bulbs are one after the other, they share one path and are dim.', 'Give each bulb its own path from the top wire to the bottom wire.', 'Put a bulb and a wire down one column, and the other bulb and wire down another column.'],
      learn: 'Bulbs in parallel each have their own path to the cell, so each one is as bright as a single bulb.' },
    { ch: 'Series and parallel', id: 'p3', type: 'predict', title: 'Separate paths', grid: [4, 3],
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v0,1', 'wire'), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,2', 'wire'), P('h1,2', 'switch', { name: 'S', open: true }), P('h2,2', 'wire'), P('v2,0', 'bulb', { name: 'A' }), P('v2,1', 'wire'), P('v3,0', 'bulb', { name: 'B' }), P('v3,1', 'wire')],
      steps: [
        { q: 'Switch S is going to be closed. Which bulbs will light up?', act: { close: ['S'] } },
        { q: 'Bulb A fuses. Which bulbs will light up now?', act: { blow: ['A'] } }
      ],
      learn: 'In a parallel circuit, each bulb is on its own path. If bulb A fuses, the path through bulb B is still a closed circuit, so B stays lit.' },
    { ch: 'Switches', id: 's2', type: 'build', title: 'One switch for each bulb', grid: [4, 3],
      text: 'Add two switches so that each switch controls only one bulb.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v0,1', 'wire'), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,2', 'wire'), P('h1,2', 'wire'), P('h2,2', 'wire'), P('v2,0', 'bulb', { name: 'A' }), P('v3,0', 'bulb', { name: 'B' })],
      tools: { switch: 2, wire: 2, erase: true },
      goal: function (T) {
        var sw = T.switches(); if (sw.length < 2) return 'Use two switches.';
        var all = T({ all: 'closed' }); if (!all.lit('A') || !all.lit('B')) return 'With both switches closed, both bulbs should light up.';
        var o = {}; o[sw[0]] = true; var x = T({ all: 'closed', open: o }); o = {}; o[sw[1]] = true; var y = T({ all: 'closed', open: o });
        var xa = [x.lit('A'), x.lit('B')], ya = [y.lit('A'), y.lit('B')];
        var ok = (xa[0] !== xa[1]) && (ya[0] !== ya[1]) && xa[0] !== ya[0];
        return ok ? '' : 'Try opening one switch at a time. Each switch should turn off only one bulb.';
      },
      hints: ['A switch controls the bulbs on its own path.', 'Each bulb has its own column. The switch for a bulb must be in the same column.', 'Put one switch under bulb A and the other under bulb B.'],
      learn: 'A switch in a branch of a parallel circuit controls only the bulb in that branch. A switch in the main path controls everything.' },
    { ch: 'Short circuits', id: 'x1', type: 'fix', title: 'The sneaky wire', grid: [4, 2],
      text: 'Bulb A will not light up and the cell is getting hot. Find the problem and fix it.',
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v3,0', 'bulb', { name: 'A' }), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'wire'), P('h2,1', 'wire'), P('v2,0', 'wire', { lock: false })],
      tools: { erase: true },
      goal: function (T) { var r = T(); return r.short ? 'There is still a short circuit.' : r.lit('A') ? '' : 'Bulb A is still not lit.'; },
      hints: ['Electric current takes the easiest path.', 'One wire gives the current a shortcut that skips bulb A.', 'Erase the wire standing up next to bulb A.'],
      learn: 'A wire across a bulb makes a short circuit: the current flows through the wire instead of the bulb. The bulb does not light up and the cell runs down quickly and gets hot.' },
    { ch: 'Short circuits', id: 'x2', type: 'predict', title: 'Main switch and branch switch', grid: [4, 3],
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('v0,1', 'wire'), P('h0,0', 'wire'), P('h1,0', 'wire'), P('h2,0', 'wire'), P('h0,2', 'wire'), P('h1,2', 'switch', { name: 'S1', open: true }), P('h2,2', 'wire'), P('v2,0', 'bulb', { name: 'A' }), P('v2,1', 'switch', { name: 'S2', open: true }), P('v3,0', 'bulb', { name: 'B' }), P('v3,1', 'wire')],
      steps: [
        { q: 'S1 is going to be closed. S2 stays open. Which bulbs will light up?', act: { close: ['S1'] } },
        { q: 'Now S2 is closed too. Which bulbs will light up?', act: { close: ['S2'] } },
        { q: 'Now S1 is opened (S2 stays closed). Which bulbs will light up?', act: { open: ['S1'] } }
      ],
      learn: 'S1 is in the main path, so it controls both bulbs. S2 is only in the branch with bulb A, so it controls only bulb A.' },
    { ch: 'Explain like an examiner', id: 'e1', type: 'oeq', title: 'Why did B go off?', grid: [4, 2],
      parts: [P('v0,0', 'battery', { dir: -1, name: 'Cell' }), P('h0,0', 'wire'), P('h1,0', 'bulb', { name: 'A', blown: true }), P('h2,0', 'bulb', { name: 'B' }), P('v3,0', 'wire'), P('h0,1', 'wire'), P('h1,1', 'switch', { name: 'S' }), P('h2,1', 'wire')],
      q: 'Bulb A fused. Explain why bulb B did not light up even though switch S was closed.',
      chips: [

    });
    app.appendChild(q);
    hintBox(app);
    app.appendChild(actions([btn('btn go', '✅ Check', function () {
      var want = l.mats.filter(function (m) { return MAT[m][2] > 0; });
      var ok = want.length === S.picked.length && want.every(function (m) { return S.picked.indexOf(m) >= 0; });
      if (ok) finish(); else { S.wrong++; S.msg = 'Not quite. Look at your results table: every object that made the bulb light up, even dimly, is a conductor.'; render(); }
    }), hintBtn()]));
    if (S.msg && !S.done) feedback('✗ ' + S.msg, 'bad');
  }
  function predictUI() {
    var l = S.l, step = l.steps[S.step];
    var bulbs = Object.keys(S.parts).filter(function (k) { return S.parts[k].t === 'bulb'; }).map(function (k) { return S.parts[k].name; });
    if (S.hidden) {
      var c = el('div', 'chips');
      bulbs.concat(['None']).forEach(function (n) {
        var b = btn('chip', n === 'None' ? 'None of them' : 'Bulb ' + n, function () {
          if (n === 'None') S.picked = S.picked.indexOf('None') >= 0 ? [] : ['None'];
          else { S.picked = S.picked.filter(function (x) { return x !== 'None'; }); var i = S.picked.indexOf(n); if (i < 0) S.picked.push(n); else S.picked.splice(i, 1); }
          render();
        });
        b.setAttribute('aria-pressed', S.picked.indexOf(n) >= 0 ? 'true' : 'false');
        c.appendChild(b);
      });
      app.appendChild(c);
      var go = btn('btn go', '▶ Test it', function () {
        var a = step.act;
        (a.close || []).forEach(function (n) { S.parts[named(n)].open = false; });
        (a.open || []).forEach(function (n) { S.parts[named(n)].open = true; });
        (a.blow || []).forEach(function (n) { S.parts[named(n)].blown = true; });
        (a.flip || []).forEach(function (n) { var p = S.parts[named(n)]; p.dir = -(p.dir || 1); });
        var r = tester()(), lit = bulbs.filter(function (n) { return r.lit(n); });
        var mine = S.picked.filter(function (x) { return x !== 'None'; });
        S.right = lit.length === mine.length && lit.every(function (n) { return mine.indexOf(n) >= 0; });
        if (!S.right) S.wrong++;
        S.actual = lit; S.hidden = false; render();
      });
      go.disabled = !S.picked.length;
      app.appendChild(actions([go]));
      return;
    }
    feedback((S.right ? '✓ You predicted correctly! ' : '✗ Not quite. ') + (S.actual.length ? 'Lit: bulb ' + S.actual.join(' and ') + '.' : 'None of the bulbs lit up.'), S.right ? 'good' : 'bad');
    if (S.done) return;
    var last = S.step === l.steps.length - 1;
    app.appendChild(actions([btn('btn go', last ? 'See what you learnt →' : 'Next question →', function () {
      if (last) { finish(); return; }
      S.step++; S.picked = []; S.hidden = true; render();
    })]));
  }
  function oeqUI() {
    var l = S.l;
    var ans = el('div', 'answer');
    if (!S.answer.length) ans.appendChild(el('span', 'ph', 'Tap the chips below to build your answer.'));
    else ans.textContent = S.answer.map(function (id) { return l.chips.filter(function (c) { return c[0] === id; })[0][1]; }).join(' ');
    app.appendChild(ans);
    var c = el('div', 'chips');
    (S.order || (S.order = l.chips.map(function (x) { return x[0]; }).sort(function () { return Math.random() - .5; }))).forEach(function (id) {
      var ch = l.chips.filter(function (x) { return x[0] === id; })[0];
      var b = btn('chip', ch[1], function () { if (S.done) return; var i = S.answer.indexOf(id); if (i < 0) S.answer.push(id); else S.answer.splice(i, 1); S.msg = ''; render(); });
      b.setAttribute('aria-pressed', S.answer.indexOf(id) >= 0 ? 'true' : 'false');
      if (S.done) b.className = 'chip ' + (ch[2] ? 'right' : '');
      c.appendChild(b);
    });
    app.appendChild(c);
    hintBox(app);
    app.appendChild(actions([btn('btn go', '✅ Check my answer', function () {
      var bad = S.answer.map(function (id) { return l.chips.filter(function (x) { return x[0] === id; })[0]; }).filter(function (x) { return !x[2]; });
      var need = l.chips.filter(function (x) { return x[2]; }), miss = need.filter(function (x) { return S.answer.indexOf(x[0]) < 0; });
      if (bad.length) { S.wrong++; S.msg = '“' + bad[0][1] + '” ' + bad[0][3]; render(); return; }
      if (miss.length) { S.wrong++; S.msg = 'Good so far, but your answer is missing ' + (miss.length === 1 ? 'a key point' : miss.length + ' key points') + '. An examiner gives marks for each link in the explanation.'; render(); return; }
      finish();
    }), hintBtn(), btn('btn', 'Clear', function () { S.answer = []; S.msg = ''; render(); })]));
    if (S.msg && !S.done) feedback('✗ ' + S.msg, 'bad');
    if (S.done) feedback('Model answer: ' + l.model, 'good');
  }

  function finish() {
    S.done = true; S.msg = '';
    S.stars = Math.max(1, 3 - S.hints - S.wrong);
    if ((save.stars[S.l.id] || 0) < S.stars) { save.stars[S.l.id] = S.stars; store(); }
    if (S.l.type === 'predict') S.hidden = false;
    render();
    var d = document.getElementById('done'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function doneBox() {
    var d = el('div', 'fb good'); d.id = 'done';
    var st = el('div', 'stars'); st.innerHTML = starStr(S.stars); d.appendChild(st);
    d.appendChild(el('h3', null, S.stars === 3 ? 'Brilliant!' : 'Well done!'));
    d.appendChild(el('p', null, '🧠 ' + S.l.learn));
    var next = S.i < L.length - 1;
    d.appendChild(actions([btn('btn go', next ? 'Next level →' : 'Back to all levels', function () { if (next) play(S.i + 1); else home(); }), btn('btn', 'Play again', function () { play(S.i); })]));
    return d;
  }

  home();
})();
</script>
</body>
</html>
