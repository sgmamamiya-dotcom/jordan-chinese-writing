<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bryan's Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="../hub.css">
<style>
[hidden]{display:none!important}
.wrap{max-width:820px}
h1{color:var(--ink)}
.back{cursor:pointer;background:none;border:0;font:700 17px var(--body);padding:0}

/* level filter */
.game{display:block;margin:0 0 16px;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:#FFF6D6;color:var(--ink);font-weight:700;text-decoration:none;box-shadow:0 5px 0 var(--ink)}
.game:hover{background:#FFEFB0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.filters button{font:700 15px var(--body);min-height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff}

/* topic list (like the 必考字 day list) */
.theme{margin:24px 0 10px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px}
.theme i{width:14px;height:14px;border-radius:50%;display:inline-block}
.topics{display:grid;gap:10px}
.topic{display:block;width:100%;text-align:left;background:var(--card);border:2px solid #d8dde4;border-radius:16px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.topic:hover{border-color:var(--c)}
.topic .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:14px}
.topic .lv{color:var(--c)}
.topic .st{color:var(--mute);font-size:13px;white-space:nowrap}
.topic .st.done{color:#1f7a3f}
.topic .t{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:21px;font-weight:700}
.topic .t span:first-child{font-size:26px}

/* topic page */
.thead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.thead .big{font-size:52px;line-height:1}
.thead h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1.1}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 12px;border-radius:999px;color:#fff;margin-top:6px}
.door{cursor:pointer;text-align:left;font:inherit}

/* section tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 0 14px}
.tabs button{flex:0 0 auto;font:700 14px var(--body);min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--ink)}
.panel h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px}
.panel .intro{color:var(--mute);margin:0 0 12px}
.points{margin:0;padding-left:22px}
.points li{margin:0 0 10px;font-size:17px;line-height:1.55}
.tiplist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tiplist li{background:#FFF7DD;border-left:6px solid var(--yellow);border-radius:0 12px 12px 0;padding:10px 14px;font-size:16px}
.facts{display:grid;gap:12px}
.facts div{background:#EEF7FF;border-radius:14px;padding:14px 16px;font-size:17px}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.flip{min-height:110px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:12px;font:inherit;color:var(--ink);cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center}
.flip b{font-family:var(--display);font-size:20px}
.flip[aria-pressed=true]{background:#F1ECFF}

/* quiz */
.qscore{font-weight:700;margin:0 0 12px}
.q{border-top:2px dashed #e1dcef;padding:14px 0}
.q p{font-weight:700;font-size:17px;margin:0 0 8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;font:16px var(--body);color:var(--ink);background:#fff;border:2px solid #cfd5dd;border-radius:12px;padding:10px 12px;cursor:pointer}
.opts button.right{border-color:#2E8B57;background:#E5F5EA}
.opts button.wrong{border-color:#CF3F3F;background:#FBE7E7}
.opts button:disabled{cursor:default;color:var(--ink)}
.why{margin:8px 0 0;font-size:15px;color:#3f4a5a}

/* experiments */
.sim{display:grid;gap:10px}
.sim .stage{width:100%;height:auto;background:#FBFDFF;border:2px solid #dfe5ec;border-radius:14px;display:block}
.sim canvas.stage{max-width:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl .lbl,.lbl{font-weight:700;font-size:14px;color:var(--mute);margin-right:4px}
.chip,.sbtn{font:700 14px var(--body);min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.sbtn{background:var(--yellow)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.sbtn:disabled{opacity:.4;cursor:default}
.slider{gap:10px}
.slider input{flex:1;min-width:140px;accent-color:var(--purple)}
.slider .val{font-weight:700;min-width:6em}
.out{background:#F4F1FF;border-radius:12px;padding:10px 14px;font-size:16px;min-height:44px}
.out.good{background:#E5F5EA}
.out.bad{background:#FBE7E7}
.bigcard{font-size:20px;font-weight:700;text-align:center;padding:10px}
.bigcard .emo,.keybox .emo,.dish .emo{font-size:64px;line-height:1.1}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed #cfd5dd;border-radius:14px;padding:10px;min-height:80px}
.bin .got{font-size:28px;display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.keybox{text-align:center}
.keybox .kq{font-size:18px;font-weight:700;margin:8px 0}
.keybox .ctrl{justify-content:center}
.path{text-align:left;color:var(--mute);font-size:14px;margin:6px auto;max-width:420px}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dish{border:2px solid #cfd5dd;border-radius:14px;padding:10px;display:grid;gap:6px;text-align:center}
.dish.yes{border-color:#2E8B57;background:#F1FAF3}
.dish.no{border-color:#CF3F3F;background:#FDF3F3}
.dish .chip{font-size:12px;min-height:34px;padding:0 8px}
.meter{height:18px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.meter span{display:block;height:100%;width:50%;background:linear-gradient(90deg,#CF3F3F,#F2B84B,#2E8B57);transition:width .3s}
.scroll{overflow-x:auto}
table.res{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
table.res th,table.res td{border:1px solid #d8dde4;padding:6px 8px;text-align:left}
table.res th{background:#F4F1FF}
.chip:focus-visible,.sbtn:focus-visible,.topic:focus-visible,.tabs button:focus-visible,.opts button:focus-visible,.flip:focus-visible,.filters button:focus-visible{outline:4px solid var(--purple);outline-offset:2px}
.vids{display:grid;gap:18px;margin-bottom:18px}
.vid h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 8px}
.vid .frame{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.vid label{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.vid input{width:22px;height:22px;accent-color:#0F766E}
.vid a,.formlink{font-weight:700;color:var(--purple)}
.vid .by{margin:-6px 0 8px;color:var(--mute);font-size:14px}
.deck{border-radius:20px;background:linear-gradient(160deg,#0F766E,#134E4A);padding:6px;box-shadow:0 8px 0 var(--ink);border:3px solid var(--ink)}
.slide{background:#fff;border-radius:15px;padding:22px 24px;min-height:340px;display:flex;flex-direction:column;gap:10px}
.slide .kick{font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.slide h3{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.4vw,34px);line-height:1.1;margin:0;display:flex;gap:10px;align-items:center}
.slide .em{font-size:1.2em}
.slide ul{margin:0;padding-left:22px;display:grid;gap:6px;font-size:clamp(16px,2.4vw,19px)}
.slide .steps{list-style:none;padding:0;margin:4px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;counter-reset:st}
.slide .steps li{counter-increment:st;background:#E6F6F4;border:2px solid #0F766E;border-radius:12px;padding:8px 12px;font-weight:700}
.slide .steps li::before{content:counter(st) ". ";color:#0F766E}
.slide .steps li:not(:last-child)::after{content:" →";color:var(--mute)}
.slide .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.slide .col{border:2px solid #cfe5e2;border-radius:14px;padding:12px;background:#F6FBFA}
.slide .col b{font-family:var(--display);font-size:20px;color:#0F766E}
.slide .col p{margin:4px 0 0}
.slide .col .eg{color:var(--mute);font-size:14px;font-style:italic}
.slide .note{margin:auto 0 0;background:#FFF6D6;border-radius:12px;padding:10px 12px;font-weight:700}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.scount{font-weight:700;color:var(--mute)}
.sdots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.sdots button{width:14px;height:14px;border-radius:50%;border:2px solid #0F766E;background:#fff;padding:0;cursor:pointer}
.sdots button[aria-current="true"]{background:#0F766E}
.sbtn:disabled{opacity:.4;cursor:default}
.act{border:2px solid #d8dde4;border-radius:14px;padding:12px 14px;margin-bottom:14px;background:#fff}
.act h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.act .by{margin:0 0 6px;color:var(--mute);font-size:14px}
.actframe{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#000;margin:8px 0}
.actframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.formbox{border:2px solid #d8dde4;border-radius:14px;overflow:hidden;background:#fff}
.formbox iframe{display:block;width:100%;height:1400px;border:0}
@media(prefers-reduced-motion:reduce){.meter span{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="science-data.js"></script>
<script src="science-olevel.js"></script>
<script src="science-sims.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var T = window.SCI_TOPICS, THEMES = window.SCI_THEMES;
  var SECTIONS = [
    ['experiment', '🧪', 'Virtual experiment'], ['summary', '📝', 'Summary'], ['terms', '🔤', 'Key words'],
    ['quiz', '❓', 'Quiz'], ['tips', '🎯', 'Exam tips'], ['facts', '💡', 'Fun facts']
  ];
  var LESSON_SECTIONS = [
    ['slides', '🖼️', 'Lesson slides'], ['videos', '🎬', 'Videos'], ['play', '🕹️', 'Try it yourself'], ['summary', '📝', 'Summary'], ['terms', '🔤', 'Key words'],
    ['quiz', '❓', 'Practice quiz'], ['form', '📋', 'Class quiz'], ['tips', '🎯', 'Exam tips'], ['facts', '💡', 'Fun facts']
  ];
  function sectionsFor(t) { return t.kind === 'lesson' ? LESSON_SECTIONS.filter(function (s) { return s[0] !== 'play' || t.activities; }) : SECTIONS.filter(function (s) { return s[0] !== 'experiment' || window.SCI_SIMS[t.id]; }); }
  var BEST_KEY = 'sci_best_v1', FILTER_KEY = 'sci_level_v1', WATCH_KEY = 'sci_watched_v1';
  function read(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var best = read(BEST_KEY, {}), watched = read(WATCH_KEY, {});
  function watchedCount(t) { return t.videos.filter(function (v) { return watched[t.id + ':' + v.id]; }).length; }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function button(cls, text, fn) { var b = el('button', cls, text); b.type = 'button'; b.onclick = fn; return b; }
  function topic(id) { return T.filter(function (t) { return t.id === id; })[0]; }
  function go(hash) { location.hash = hash; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  /* ---------- topic list ---------- */
  function listView() {
    var level = read(FILTER_KEY, 'all');
    app.textContent = '';
    var back = el('a', 'back', '← Bryan'); back.href = 'index.html'; app.appendChild(back);
    app.appendChild(el('h1', null, '🔬 Science Lab'));
    app.appendChild(el('p', 'hello', T.filter(function (t) { return t.kind !== 'lesson'; }).length + ' topics from P3 to P6, each with a virtual experiment, summary, key words, quiz, exam tips and fun facts, plus SPSO (Science Olympiad) lessons.'));
    var game = el('a', 'game', '⚡ Circuit Lab game: build, fix and predict circuits, then explain them like an examiner →'); game.href = 'circuit-lab.html'; app.appendChild(game);
    var f = el('div', 'filters'); f.setAttribute('role', 'group'); f.setAttribute('aria-label', 'Show level');
    ['all', 'P3', 'P4', 'P5', 'P6', 'SPSO'].forEach(function (lv) {
      var b = button(null, lv === 'all' ? 'All levels' : lv, function () { write(FILTER_KEY, lv); listView(); });
      b.setAttribute('aria-pressed', lv === level ? 'true' : 'false'); f.appendChild(b);
    });
    app.appendChild(f);
    Object.keys(THEMES).forEach(function (th) {
      var list = T.filter(function (t) { return t.theme === th && (level === 'all' || covers(t.level, level)); });
      if (!list.length) return;
      var h = el('h2', 'theme'), dot = el('i'); dot.style.background = THEMES[th].color; h.appendChild(dot); h.appendChild(document.createTextNode(THEMES[th].name));
      app.appendChild(h);
      var box = el('div', 'topics');
      list.forEach(function (t) {
        var c = button('topic', null, function () { go('#t=' + t.id); });
        c.style.setProperty('--c', THEMES[t.theme].color);
        var row = el('div', 'row');
        row.appendChild(el('span', 'lv', t.kind === 'lesson' ? THEMES[t.theme].name + ' · Lesson' : t.level + ' · ' + THEMES[t.theme].name));
        if (t.kind === 'lesson') {
          var w = watchedCount(t), lb = best[t.id];
          row.appendChild(el('span', 'st' + (w === t.videos.length && lb === t.quiz.length ? ' done' : ''), !w && lb == null ? 'Start →' : 'Videos ' + w + '/' + t.videos.length + (lb == null ? '' : ' · Quiz ' + lb + '/' + t.quiz.length)));
        } else {
          var b = best[t.id];
          row.appendChild(el('span', 'st' + (b === t.quiz.length ? ' done' : ''), b == null ? 'Start →' : (b === t.quiz.length ? '✓ Quiz ' : 'Quiz ') + b + '/' + t.quiz.length));
        }
        var tt = el('div', 't'); tt.appendChild(el('span', null, t.emoji)); tt.appendChild(el('span', null, t.title));
        c.appendChild(row); c.appendChild(tt); box.appendChild(c);
      });
      app.appendChild(box);
    });
  }
  // "P3–P4" covers P3 and P4.
  function covers(range, lv) { if (range === 'SPSO' || lv === 'SPSO') return range === lv; var p = range.replace('P', '').split(/[–-]/).map(function (x) { return +x.replace('P', ''); }); var n = +lv.slice(1); return n >= p[0] && n <= (p[1] || p[0]); }

  /* ---------- topic page ---------- */
  function header(t) {
    var h = el('div', 'thead');
    h.appendChild(el('div', 'big', t.emoji));
    var d = el('div'); d.appendChild(el('h1', null, t.title));
    var pill = el('span', 'pill', t.kind === 'lesson' ? THEMES[t.theme].name : t.level + ' · ' + THEMES[t.theme].name); pill.style.background = THEMES[t.theme].color; d.appendChild(pill);
    h.appendChild(d); return h;
  }
  function topicView(t) {
    app.textContent = '';
    app.appendChild(button('back', '← All topics', function () { go('#'); }));
    app.appendChild(header(t));
    var grid = el('nav', 'doors');
    sectionsFor(t).forEach(function (s) {
      var d = button('door', null, function () { go('#t=' + t.id + '&s=' + s[0]); });
      d.appendChild(el('div', 'icon', s[1]));
      d.appendChild(el('h3', null, s[2]));
      var sub = t.kind === 'lesson' ? { slides: t.slides.length + ' slides to go through', play: (t.activities || []).length + ' interactive activities', videos: t.videos.length + ' videos · ' + watchedCount(t) + ' watched', summary: t.summary.length + ' key points', terms: t.terms.length + ' flip cards', quiz: best[t.id] == null ? t.quiz.length + ' questions' : 'Best score: ' + best[t.id] + '/' + t.quiz.length, form: 'The class Google Form', tips: 'Common mistakes to avoid', facts: t.facts.length + ' surprising facts' }[s[0]] : { experiment: t.sim, summary: t.summary.length + ' key points', terms: t.terms.length + ' flip cards', quiz: best[t.id] == null ? t.quiz.length + ' questions' : 'Best score: ' + best[t.id] + '/' + t.quiz.length, tips: 'Common mistakes to avoid', facts: t.facts.length + ' surprising facts' }[s[0]];
      d.appendChild(el('p', null, sub));
      d.appendChild(el('span', 'enter', 'Open →'));
      grid.appendChild(d);
    });
    app.appendChild(grid);
  }

  /* ---------- sections ---------- */
  function sectionView(t, sec) {
    app.textContent = '';
    app.appendChild(button('back', '← ' + t.title, function () { go('#t=' + t.id); }));
    app.appendChild(header(t));
    var tabs = el('div', 'tabs'); tabs.setAttribute('role', 'group'); tabs.setAttribute('aria-label', 'Sections');
    sectionsFor(t).forEach(function (s) {
      var b = button(null, s[1] + ' ' + s[2], function () { go('#t=' + t.id + '&s=' + s[0]); });
      b.setAttribute('aria-pressed', s[0] === sec ? 'true' : 'false'); tabs.appendChild(b);
    });
    app.appendChild(tabs);
    var p = el('section', 'panel'), S = sectionsFor(t).filter(function (s) { return s[0] === sec; })[0];
    p.appendChild(el('h2', null, S[1] + ' ' + S[2]));
    ({ experiment: experiment, summary: summary, terms: terms, quiz: quiz, tips: tips, facts: facts, videos: videos, form: form, slides: slides, play: play })[sec](t, p);
    app.appendChild(p);
  }
  function experiment(t, p) {
    p.appendChild(el('p', 'intro', t.sim));
    var box = el('div', 'sim'); p.appendChild(box);
    try { window.SCI_SIMS[t.id](box); } catch (e) { box.appendChild(el('p', null, 'This experiment could not start.')); }
  }
  function videos(t, p) {
    p.appendChild(el('p', 'intro', 'Watch each video, then tick it off. When you have watched them all, try the practice quiz and the class quiz.'));
    var list = el('div', 'vids');
    t.videos.forEach(function (vd, i) {
      var id = vd.id, v = el('div', 'vid');
      v.appendChild(el('h3', null, 'Video ' + (i + 1) + ': ' + vd.title));
      v.appendChild(el('p', 'by', 'by ' + vd.by));
      var fr = el('div', 'frame'), ifr = document.createElement('iframe');
      ifr.src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0';
      ifr.title = vd.title;
      ifr.loading = 'lazy';
      ifr.allow = 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen';
      ifr.setAttribute('allowfullscreen', '');
      fr.appendChild(ifr); v.appendChild(fr);
      var row = el('div', 'row'), lab = el('label'), cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!watched[t.id + ':' + id];
      cb.onchange = function () { if (cb.checked) watched[t.id + ':' + id] = true; else delete watched[t.id + ':' + id]; write(WATCH_KEY, watched); };
      lab.appendChild(cb); lab.appendChild(document.createTextNode('I watched this video'));
      var a = el('a', null, 'Open on YouTube ↗'); a.href = 'https://youtu.be/' + id; a.target = '_blank'; a.rel = 'noopener';
      row.appendChild(lab); row.appendChild(a); v.appendChild(row);
      list.appendChild(v);
    });
    p.appendChild(list);
    p.appendChild(button('sbtn', '❓ Try the practice quiz →', function () { go('#t=' + t.id + '&s=quiz'); }));
  }
  // Interactive activities from other websites: a card each, embedded when the site allows it.
  function play(t, p) {
    p.appendChild(el('p', 'intro', 'Try these online activities. They are needed for some questions in the class quiz.'));
    t.activities.forEach(function (a) {
      var box = el('div', 'act');
      box.appendChild(el('h3', null, a.title));
      box.appendChild(el('p', 'by', a.by));
      box.appendChild(el('p', null, a.what));
      if (a.embed) {
        var fr = el('div', 'actframe'), ifr = document.createElement('iframe');
        ifr.src = a.url; ifr.title = a.title; ifr.loading = 'lazy'; ifr.allow = 'fullscreen'; ifr.setAttribute('allowfullscreen', '');
        fr.appendChild(ifr); box.appendChild(fr);
      }
      var link = el('a', 'formlink', (a.embed ? 'Open full screen' : 'Open the activity') + ' ↗'); link.href = a.url; link.target = '_blank'; link.rel = 'noopener';
      box.appendChild(link);
      p.appendChild(box);
    });
  }
  function form(t, p) {
    var link = el('a', 'formlink', 'Open the quiz in a new tab ↗'); link.href = t.form; link.target = '_blank'; link.rel = 'noopener';
    var intro = el('p', 'intro', 'Answer the questions below and press Submit at the end. If the form does not show, or asks you to sign in, '); intro.appendChild(link); intro.appendChild(document.createTextNode('.'));
    p.appendChild(intro);
    var box = el('div', 'formbox'), ifr = document.createElement('iframe');
    ifr.src = t.form + (t.form.indexOf('?') < 0 ? '?' : '&') + 'embedded=true';
    ifr.title = t.title + ' quiz'; ifr.loading = 'lazy';
    box.appendChild(ifr); p.appendChild(box);
  }
  // Slide deck: one slide at a time, with buttons, arrow keys and swipe.
  var slideKeys = null;
  document.addEventListener('keydown', function (e) { if (slideKeys && !e.altKey && !e.ctrlKey && !e.metaKey) slideKeys(e); });
  function slides(t, p) {
    var n = 0, N = t.slides.length;
    var deck = el('div', 'deck'), card = el('div', 'slide'); card.setAttribute('aria-live', 'polite'); deck.appendChild(card);
    var bar = el('div', 'sbar'), prev = button('sbtn', '← Back', function () { show(n - 1); }), count = el('span', 'scount'), next = button('sbtn', 'Next →', function () { show(n + 1); });
    var dots = el('div', 'sdots');
    t.slides.forEach(function (x, i) { var d = button(null, null, function () { show(i); }); d.setAttribute('aria-label', 'Slide ' + (i + 1) + ': ' + x.title); dots.appendChild(d); });
    bar.appendChild(prev); bar.appendChild(count); bar.appendChild(next);
    p.appendChild(deck); p.appendChild(bar); p.appendChild(dots);
    function show(i) {
      n = Math.max(0, Math.min(N - 1, i)); var x = t.slides[n];
      card.textContent = '';
      card.appendChild(el('div', 'kick', x.kicker || 'Slide ' + (n + 1)));
      var h = el('h3'); if (x.emoji) h.appendChild(el('span', 'em', x.emoji)); h.appendChild(document.createTextNode(x.title)); card.appendChild(h);
      if (x.points) { var ul = el('ul'); x.points.forEach(function (s) { ul.appendChild(el('li', null, s)); }); card.appendChild(ul); }
      if (x.steps) { var st = el('ol', 'steps'); x.steps.forEach(function (s) { st.appendChild(el('li', null, s)); }); card.appendChild(st); }
      if (x.cols) {
        var cg = el('div', 'cols');
        x.cols.forEach(function (c) { var b = el('div', 'col'); b.appendChild(el('b', null, c[0])); b.appendChild(el('p', null, c[1])); if (c[2]) b.appendChild(el('p', 'eg', c[2])); cg.appendChild(b); });
        card.appendChild(cg);
      }
      if (x.note) card.appendChild(el('p', 'note', x.note));
      count.textContent = (n + 1) + ' / ' + N;
      prev.disabled = n === 0;
      next.textContent = n === N - 1 ? 'Practice quiz →' : 'Next →';
      Array.prototype.forEach.call(dots.children, function (d, k) { d.setAttribute('aria-current', k === n ? 'true' : 'false'); });
    }
    next.onclick = function () { if (n === N - 1) go('#t=' + t.id + '&s=quiz'); else show(n + 1); };
    slideKeys = function (e) {
      if (!document.body.contains(card)) { slideKeys = null; return; }
      if (e.key === 'ArrowRight') { show(n + 1); e.preventDefault(); } else if (e.key === 'ArrowLeft') { show(n - 1); e.preventDefault(); }
    };
    var sx = null;
    deck.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) show(n + (dx < 0 ? 1 : -1)); });
    show(0);
  }
  function summary(t, p) { var ol = el('ol', 'points'); t.summary.forEach(function (x) { ol.appendChild(el('li', null, x)); }); p.appendChild(ol); }
  function terms(t, p) {
    p.appendChild(el('p', 'intro', 'Tap a card to see its meaning. Tap again to flip it back.'));
    var g = el('div', 'cards');
    t.terms.forEach(function (x) {
      var c = button('flip', null, function () { var on = c.getAttribute('aria-pressed') === 'true'; c.setAttribute('aria-pressed', on ? 'false' : 'true'); fill(!on); });
      function fill(back) { c.textContent = ''; if (back) c.appendChild(el('span', null, x[1])); else c.appendChild(el('b', null, x[0])); c.setAttribute('aria-label', back ? x[0] + ': ' + x[1] : x[0]); }
      c.setAttribute('aria-pressed', 'false'); fill(false); g.appendChild(c);
    });
    p.appendChild(g);
  }
  function quiz(t, p) {
    var answered = 0, right = 0;
    var score = el('p', 'qscore'); p.appendChild(score);
    function upd() {
      score.textContent = 'Score: ' + right + ' / ' + t.quiz.length + (answered === t.quiz.length ? (right === t.quiz.length ? ' 🎉 Perfect!' : ' · Done!') : '') + (best[t.id] != null ? '   (best: ' + best[t.id] + ')' : '');
    }
    t.quiz.forEach(function (q, i) {
      var box = el('div', 'q'); box.appendChild(el('p', null, (i + 1) + '. ' + q.q));
      var opts = el('div', 'opts'), why = el('p', 'why'); why.hidden = true;
      shuffle(q.a.map(function (a, k) { return k; })).forEach(function (k) {
        var b = button(null, q.a[k], function () {
          answered++; if (k === q.c) right++;
          Array.prototype.forEach.call(opts.children, function (o) { o.disabled = true; if (+o.dataset.k === q.c) o.classList.add('right'); });
          if (k !== q.c) b.classList.add('wrong');
          why.textContent = (k === q.c ? '✓ ' : '✗ ') + q.e; why.hidden = false;
          if (answered === t.quiz.length && (best[t.id] == null || right > best[t.id])) { best[t.id] = right; write(BEST_KEY, best); }
          upd();
        });
        b.dataset.k = k; opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(why); p.appendChild(box);
    });
    p.appendChild(button('sbtn', '↻ Try again', function () { sectionView(t, 'quiz'); }));
    upd();
  }
  function tips(t, p) { var ul = el('ul', 'tiplist'); t.tips.forEach(function (x) { ul.appendChild(el('li', null, x)); }); p.appendChild(ul); }
  function facts(t, p) { var g = el('div', 'facts'); t.facts.forEach(function (x) { g.appendChild(el('div', null, '💡 ' + x)); }); p.appendChild(g); }

  /* ---------- routing: #t=<topic>&s=<section> ---------- */
  function route() {
    var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
    var t = q.t && topic(q.t);
    if (!t) listView();
    else if (q.s && sectionsFor(t).some(function (s) { return s[0] === q.s; })) sectionView(t, q.s);
    else topicView(t);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
