# Keeps the free Supabase project from being paused for inactivity.
# Runs a small read query every 3 days. Can also be started by hand from the Actions tab.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://uscpgatqeeqejbwnvyoh.supabase.co
          # Public (publishable) key, the same one the website already uses.
          SUPABASE_KEY: sb_publishable_Tc5qBurC5SnTyNjB2jtA2A_jFs9T3og
        run: |
          for table in characters groups; do
            curl -fsS "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" > /dev/null
            echo "$table ok"
          done
