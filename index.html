<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jordan 中文练字 V17</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#222;--muted:#777;--line:#e5e7ee;--a:#4f7cff;--soft:#eef3ff;--good:#22a06b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #24345a0a}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0;font-size:29px}.sub,.note{color:var(--muted);font-size:13px}.status{padding:7px 11px;border-radius:99px;background:#fff4df;color:#946500;font-size:13px}.status.ok{background:#eaf8f1;color:#16744b}.status.err{background:#fff0f0;color:#b52e2e}
.title{font-weight:700;font-size:18px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#fafbfe;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#777}
.toolbar,.tabs,.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:12px}select,input,textarea{border:1px solid #d9dce5;border-radius:10px;padding:9px 11px;background:#fff}button{font:inherit;cursor:pointer}.btn{border:1px solid #d9dce5;background:#fff;border-radius:10px;padding:9px 13px}.primary{background:var(--a);color:#fff;border-color:var(--a)}.soft{background:var(--soft);color:#315bd6;border-color:#dbe4ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;max-height:270px;overflow:auto}.char{position:relative;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:28px}.char small{display:block;font-size:10px;color:#999}.char.active{border:2px solid var(--a);background:#f3f6ff}.dot{position:absolute;right:5px;top:5px;width:7px;height:7px;background:var(--good);border-radius:50%}
.tabs{margin-bottom:10px}.tab{border:0;background:#f1f3f8;padding:9px 15px;border-radius:10px;color:#666}.tab.active{background:#e8efff;color:#315bd6;font-weight:700}
.head{display:flex;justify-content:center;align-items:center;gap:12px}.pinyin{font-size:18px;color:#666}.speaker{border:0;background:#f0f3fa;border-radius:50%;width:38px;height:38px;font-size:19px}
.practice{display:grid;grid-template-columns:minmax(360px,1fr) 320px;gap:20px}.main{min-height:520px}.write{position:relative;width:min(500px,92vw);aspect-ratio:1;margin:12px auto;border:2px solid #dfe3ec;background-color:#fff;background-image:linear-gradient(90deg,transparent 49.7%,#e8ebf2 49.7%,#e8ebf2 50.3%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#e8ebf2 49.7%,#e8ebf2 50.3%,transparent 50.3%),linear-gradient(45deg,transparent 49.75%,#f0f1f5 49.75%,#f0f1f5 50.25%,transparent 50.25%),linear-gradient(-45deg,transparent 49.75%,#f0f1f5 49.75%,#f0f1f5 50.25%,transparent 50.25%);overflow:hidden}
#trace,#canvas{position:absolute;inset:0;width:100%;height:100%}#canvas{touch-action:none}.controls{justify-content:center}.hint{text-align:center;color:#888;font-size:13px;margin-top:8px}.big{font-size:72px;text-align:center;padding:18px}.days{display:flex;gap:5px;margin-top:7px}.day{width:29px;height:29px;border-radius:7px;background:#f0f1f5;display:flex;align-items:center;justify-content:center;font-size:10px;color:#777}.day.done{background:#d9f3e7;color:#14764b}
.modalback{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#fff;border-radius:18px;padding:20px;width:min(620px,100%)}textarea{width:100%;min-height:140px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media(max-width:820px){.practice{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.app{padding:13px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Jordan 中文练字</h1><div class="sub">练习、描红、自写与每日打卡</div></div><div id="status" class="status">正在连接…</div></header>

<section class="card"><div class="title">📅 每日打卡</div>
<div class="stats">
<div class="stat"><span>今天</span><b id="today">0</b><span>个字</span></div>
<div class="stat"><span>本月</span><b id="month">0</b><span>个字</span></div>
<div class="stat"><span>累计</span><b id="total">0</b><span>次完成</span></div>
<div class="stat"><span>连续</span><b id="streak">0</b><span>天</span></div>
<div class="stat"><span>目标</span><b>10</b><span>个/天</span></div>
</div><div class="sub" style="margin-top:12px">最近 7 天</div><div id="days" class="days"></div></section>

<section class="card"><div class="toolbar"><div class="title" style="margin:0">🀄 生字库</div><select id="groups"></select><button class="btn soft" id="add">＋ 批量添加生字</button><span id="count" class="sub"></span></div><div id="chars" class="grid"></div></section>

<section class="card">
<div class="tabs"><button id="traceTab" class="tab active">① 描红</button><button id="selfTab" class="tab">② 自己写 + 检查</button></div>
<div class="head"><span id="py" class="pinyin">—</span><button id="speak" class="speaker">🔊</button></div>
<div class="practice"><div class="main">
<div class="write"><div id="trace"></div><canvas id="canvas"></canvas></div>
<div id="traceCtl" class="controls"><button id="replay" class="btn primary">▶ 再看一次笔顺</button><button id="done" class="btn">✓ 完成这个字</button></div>
<div id="selfCtl" class="controls" style="display:none"><button id="clear" class="btn">清除重写</button><button id="grade" class="btn primary">✓ 检查并完成</button></div>
<div id="hint" class="hint">跟着淡色笔画描红，完成后点击“完成这个字”。</div>
</div>
<div><div class="title">练习说明</div><div class="note">描红模式会显示正确笔顺动画，适合先观察、再跟写。<br><br>自写模式使用独立田字格，不显示右侧大字；写完后点击“检查并完成”记录当天打卡。<br><br>每个字每天只计入一次。数据同步到 Supabase 后，电脑和 iPad 可以共享。</div><div class="title" style="margin-top:18px">当前生字</div><div id="big" class="big">昨</div></div>
</div></section>
</div>

<div id="modal" class="modalback"><div class="modal"><div class="title">批量添加生字</div><div class="note" style="margin-bottom:10px">可输入连续汉字，也可用空格、换行、逗号分隔；重复自动去重。</div><textarea id="batch" placeholder="例如：春夏秋冬&#10;或者：春 夏 秋 冬"></textarea><div class="modalactions"><button id="cancel" class="btn">取消</button><button id="confirm" class="btn primary">添加</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer-lib.min.js"></script>
<script>
const SUPABASE_URL='https://uscpgatqeeqejbwnvyoh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Tc5qBurC5SnTyNjB2jtA2A_jFs9T3og';
const PY={'昨':'zuó','明':'míng','给':'gěi','快':'kuài','乐':'lè','每':'měi','兔':'tù','爪':'zhǎo','尖':'jiān','园':'yuán','我':'wǒ','你':'nǐ','他':'tā','学':'xué','校':'xiào','家':'jiā','天':'tiān','大':'dà','小':'xiǎo','人':'rén','上':'shàng','下':'xià'};
const DEFAULT=Object.keys(PY);let groups=[],chars=[],selectedGroup=null,selected='昨',mode='trace',writer=null,doneSet=new Set();
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);
async function sb(path,opt={}){let h={'apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json','Prefer':opt.prefer||'return=representation'};let r=await fetch(SUPABASE_URL+path,{...opt,headers:{...h,...(opt.headers||{})}});if(!r.ok)throw Error(r.status+' '+await r.text());let t=await r.text();return t?JSON.parse(t):[]}
function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}
function current(){return chars.filter(x=>String(x.group_id)===String(selectedGroup))}
async function load(){try{groups=await sb('/rest/v1/groups?select=*&order=id.asc');chars=await sb('/rest/v1/characters?select=*&order=id.asc');if(!groups.length)groups=await sb('/rest/v1/groups',{method:'POST',body:JSON.stringify({name:'默认'})});selectedGroup=selectedGroup||groups[0].id;let have=new Set(chars.map(x=>x.char)),missing=DEFAULT.filter(c=>!have.has(c));if(missing.length)chars.push(...await sb('/rest/v1/characters',{method:'POST',body:JSON.stringify(missing.map(c=>({char:c,pinyin:PY[c]||'',group_id:selectedGroup}))))});await practice();status('已连接','ok')}catch(e){console.error(e);status('⚠️ 连接失败','err');if(!groups.length)groups=[{id:0,name:'默认'}];if(!chars.length)chars=DEFAULT.map((c,i)=>({id:i,char:c,pinyin:PY[c]||'',group_id:0}))}render()}
async function practice(){let r=await sb('/rest/v1/practice?select=practice_date,char,completed_at&order=practice_date.desc');doneSet=new Set(r.map(x=>x.practice_date+'|'+x.char));stats(r)}
function stats(r){let t=new Set(r.filter(x=>x.practice_date===today).map(x=>x.char));let m=today.slice(0,7);$('today').textContent=t.size;$('month').textContent=new Set(r.filter(x=>x.practice_date.startsWith(m)).map(x=>x.practice_date+'|'+x.char)).size;$('total').textContent=r.length;let n=0,d=new Date(today+'T12:00:00');while(r.some(x=>x.practice_date===d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}$('streak').textContent=n;$('days').innerHTML='';for(let i=6;i>=0;i--){let x=new Date(today+'T12:00:00');x.setDate(x.getDate()-i);let s=x.toISOString().slice(0,10),e=document.createElement('div');e.className='day '+(r.some(y=>y.practice_date===s)?'done':'');e.textContent=(x.getMonth()+1)+'/'+x.getDate();$('days').append(e)}}
async function complete(){if(doneSet.has(today+'|'+selected)){render();return}try{await sb('/rest/v1/practice',{method:'POST',body:JSON.stringify({practice_date:today,char:selected})});doneSet.add(today+'|'+selected);await practice();render()}catch(e){alert('记录失败，请检查 Supabase 连接。\n\n'+e.message)}}
function render(){let s=$('groups');s.innerHTML='';groups.forEach(g=>{let o=document.createElement('option');o.value=g.id;o.textContent=g.name;s.append(o)});if(selectedGroup!=null)s.value=selectedGroup;let box=$('chars');box.innerHTML='';let list=current();$('count').textContent=list.length+' 个字';list.forEach(c=>{let b=document.createElement('button');b.className='char '+(c.char===selected?'active':'');b.innerHTML=c.char+'<small>'+(c.pinyin||PY[c.char]||'')+'</small>'+(doneSet.has(today+'|'+c.char)?'<i class="dot"></i>':'');b.onclick=()=>select(c.char);box.append(b)});$('py').textContent=PY[selected]||chars.find(x=>x.char===selected)?.pinyin||'';$('big').textContent=selected;modeUI()}
function select(c){selected=c;render();if(mode==='trace')setTimeout(trace,20);else reset()}
function trace(){let el=$('trace');el.innerHTML='';if(!window.HanziWriter){el.innerHTML='<div style="padding:40px;color:#999">笔顺库加载失败，请刷新页面。</div>';return}writer=HanziWriter.create(el,selected,{width:420,height:420,padding:15,showOutline:true,showCharacter:false,strokeAnimationSpeed:1.2,delayBetweenStrokes:250,strokeColor:'#4f7cff',outlineColor:'#d9dde8',drawingWidth:3,highlightColor:'#f2b84b',showHintAfterMisses:2});writer.animateCharacter()}
function modeUI(){$('traceTab').classList.toggle('active',mode==='trace');$('selfTab').classList.toggle('active',mode==='self');$('trace').style.display=mode==='trace'?'block':'none';$('canvas').style.display=mode==='self'?'block':'none';$('traceCtl').style.display=mode==='trace'?'flex':'none';$('selfCtl').style.display=mode==='self'?'flex':'none';$('hint').textContent=mode==='trace'?'跟着淡色笔画描红，完成后点击“完成这个字”。':'在田字格里自己写，写完后点击“检查并完成”。';if(mode==='trace')setTimeout(trace,20);else setTimeout(reset,20)}
const cv=$('canvas'),ctx=cv.getContext('2d');let draw=false,lx=0,ly=0;
function reset(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5}
function point(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.onpointerdown=e=>{if(mode!=='self')return;draw=true;cv.setPointerCapture(e.pointerId);let p=point(e);lx=p.x;ly=p.y};
cv.onpointermove=e=>{if(!draw)return;let p=point(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y};cv.onpointerup=()=>draw=false;cv.onpointercancel=()=>draw=false;
function ink(){let r=cv.getBoundingClientRect(),d=devicePixelRatio||1,a=ctx.getImageData(0,0,r.width*d,r.height*d).data;for(let i=3;i<a.length;i+=4)if(a[i]>20)return true;return false}
$('groups').onchange=e=>{selectedGroup=e.target.value;let l=current();if(l.length)selected=l[0].char;render()};$('traceTab').onclick=()=>{mode='trace';modeUI()};$('selfTab').onclick=()=>{mode='self';modeUI()};$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(selected);u.lang='zh-CN';u.rate=.75;speechSynthesis.speak(u)};$('replay').onclick=()=>writer&&writer.animateCharacter();$('done').onclick=complete;$('clear').onclick=reset;$('grade').onclick=async()=>{if(!ink())return alert('先在田字格里写一个字，再检查。');await complete();alert('已记录今天的练习 ✓')};
$('add').onclick=()=>{$('modal').style.display='flex';$('batch').focus()};$('cancel').onclick=()=>{$('modal').style.display='none';$('batch').value=''};$('confirm').onclick=async()=>{let u=[...new Set([...$('batch').value].filter(c=>/[\u3400-\u9fff]/.test(c)))],have=new Set(current().map(x=>x.char)),fresh=u.filter(c=>!have.has(c));if(!fresh.length)return alert('没有新的汉字可添加。');try{let a=await sb('/rest/v1/characters',{method:'POST',body:JSON.stringify(fresh.map(c=>({char:c,pinyin:PY[c]||'',group_id:selectedGroup})))});chars.push(...a);$('modal').style.display='none';$('batch').value='';selected=fresh[0];render()}catch(e){alert('添加失败：\n'+e.message)}};
window.onresize=()=>{if(mode==='self')reset()};render();load();
</script>
</body></html>
