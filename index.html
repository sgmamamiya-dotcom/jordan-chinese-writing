<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Jordan 中文练字 V6</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f8fb;color:#263238}
button{font:inherit;cursor:pointer;border:0}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:25px}
.sub{color:#78909c;font-size:14px;margin-top:4px}
 
.checkin-card{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #0000000b}
.checkin-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.checkin-top h2{margin:0;font-size:18px}
.checkin-sub{font-size:13px;color:#78909c;margin-top:4px}.streak{background:#fff3e0;color:#e65100;padding:8px 12px;border-radius:12px;font-weight:800}
.checkin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#f7f9fa;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#78909c}.progress-wrap{height:10px;background:#eceff1;border-radius:10px;overflow:hidden}.progress-bar{height:100%;width:0%;background:#455a64;border-radius:10px;transition:width .3s}
.calendar-title{font-size:13px;color:#78909c;margin:12px 0 7px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{padding:7px 2px;border-radius:10px;background:#f7f9fa;text-align:center}.day .dow{font-size:10px;color:#90a4ae}.day .num{font-size:16px;font-weight:700}.day .done{font-size:10px;color:#78909c}
.day.active{background:#eceff1}.day.complete{background:#e8f5e9}.day.complete .done{color:#2e7d32;font-weight:700}
@media(max-width:760px){.checkin-stats{grid-template-columns:repeat(2,1fr)}.checkin-top{align-items:flex-start;flex-direction:column}}
.library-card{background:white;border-radius:20px;padding:15px 16px;margin-bottom:14px;box-shadow:0 5px 20px #0000000b}
.library-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.library-head h2{margin:0;font-size:18px}
.library-sub{font-size:13px;color:#78909c;margin-top:4px}.library-actions{display:flex;gap:8px;flex-wrap:wrap}
.add-online{display:flex;align-items:center;gap:9px;margin:13px 0 5px;padding:11px;background:#f7f9fa;border-radius:13px}
.addCharInput{width:130px;height:42px;border:1px solid #dfe6ea;border-radius:11px;background:#fff;padding:0 12px;font-size:24px;text-align:center}
.online-note{font-size:12px;color:#78909c}
.library-tools{display:flex;gap:9px;margin:12px 0}.search,.groupSelect{height:42px;border:1px solid #dfe6ea;border-radius:11px;background:#fff;padding:0 12px;font:inherit;color:#37474f}
.search{flex:1;min-width:180px}.groupSelect{min-width:145px}.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:230px;overflow:auto;padding:2px}
.lib-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72px;border:2px solid #e7edf0;border-radius:13px;background:#fff;user-select:none}
.lib-item.selected{border-color:#455a64;background:#f0f4f6}.lib-item .hanzi{font-size:29px;line-height:1.05}.lib-item .py{font-size:11px;color:#78909c;margin-top:4px}
.lib-item input{position:absolute;top:7px;right:7px;width:17px;height:17px;accent-color:#455a64}
@media(max-width:760px){.library-head{align-items:flex-start;flex-direction:column}.library-tools{flex-direction:column}.library-grid{grid-template-columns:repeat(5,1fr);max-height:250px}}
.charbar{display:flex;gap:8px;overflow:auto;padding:6px 2px 12px}
.charbtn{min-width:64px;height:58px;border-radius:14px;background:white;font-size:25px;box-shadow:0 2px 8px #0000000d;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.charbtn small{font-size:11px;color:#78909c;margin-top:3px}.charbtn.active small{color:#eceff1}
.charbtn.active{background:#37474f;color:white}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px 8px;border-radius:14px;background:white;color:#546e7a;font-weight:700}
.tab.active{background:#455a64;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:white;border-radius:22px;padding:16px;box-shadow:0 5px 20px #0000000b}
.card h2{font-size:18px;margin:0 0 10px}
.stage{width:100%;max-width:500px;margin:auto;aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid #eceff1;overflow:hidden;position:relative;touch-action:none}
.stage.gridbg{background-image:linear-gradient(#eceff1 1px,transparent 1px),linear-gradient(90deg,#eceff1 1px,transparent 1px);background-size:25% 25%;background-position:center}
.writer{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.writer canvas{display:block!important}
#practiceCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:5;display:none;cursor:crosshair}
.hint{font-size:14px;color:#78909c;margin:10px 0;text-align:center;min-height:20px}.trace-mode .guide{opacity:.22!important}
.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.primary,.secondary{padding:11px 17px;border-radius:12px;font-weight:700}
.primary{background:#455a64;color:#fff}.secondary{background:#eceff1;color:#37474f}
.word-info{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 16px}.bigchar{text-align:center;font-size:110px;cursor:pointer;line-height:1;margin:0;font-family:"Kaiti SC","STKaiti","KaiTi",serif}.pinyin{font-size:30px;font-weight:700;color:#546e7a;min-width:78px}.soundBtn{width:48px;height:48px;border-radius:50%;background:#eaf1ff;font-size:24px}.soundBtn:active{transform:scale(.95)}
.status{text-align:center;font-weight:700;min-height:24px}
.ok{color:#2e7d32}.bad{color:#c62828}
@media(max-width:760px){.app{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:21px}.bigchar{font-size:88px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>✏️ Jordan 中文练字</h1><div class="sub">V6 · 鼠标 / Apple Pencil 都可以练</div></div>
  <button class="secondary" id="resetBtn">重新开始</button>
</header>


<section class="checkin-card">
  <div class="checkin-top">
    <div>
      <h2>🔥 每日练字打卡</h2>
      <div class="checkin-sub">今天完成练习就会自动记录，不需要另外按保存</div>
    </div>
    <div class="streak" id="streak">连续 0 天</div>
  </div>
  <div class="checkin-stats">
    <div class="stat"><b id="todayCount">0</b><span>今天完成</span></div>
    <div class="stat"><b id="todayTarget">10</b><span>今日目标</span></div>
    <div class="stat"><b id="monthCount">0</b><span>本月完成</span></div>
    <div class="stat"><b id="totalCount">0</b><span>累计完成</span></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="dailyProgress"></div></div>
  <div class="calendar-title">最近 7 天</div>
  <div class="week-grid" id="weekGrid"></div>
</section>

<section class="library-card">
  <div class="library-head">
    <div><h2>📚 生字库</h2><div class="library-sub">学生或家长可以自由选择要练习的字，也可以添加新字</div></div>
    <div class="library-actions">
      <button class="secondary" id="selectAllBtn">全选</button>
      <button class="secondary" id="clearAllBtn">清空</button>
      <button class="primary" id="practiceSelectedBtn">练习已选（0）</button>
    </div>
  </div>
  <div class="add-online">
  <input id="addCharInput" class="addCharInput" maxlength="2" placeholder="输入新字，例如：龙">
  <button class="primary" id="addCharBtn">＋ 添加这个字</button>
  <span class="online-note">输入后会自动尝试取得拼音和笔顺</span>
</div>
<div class="library-tools">
    <input id="searchInput" class="search" type="search" placeholder="🔍 搜索汉字或拼音，例如：昨天 / zuo">
    <select id="groupSelect" class="groupSelect">
      <option value="all">全部生字</option>
      <option value="P1-第一组">P1 · 第一组</option>
      <option value="P1-第二组">P1 · 第二组</option>
      <option value="常用">常用字</option><option value="我添加的字">我添加的字</option>
    </select>
  </div>
  <div class="library-grid" id="libraryGrid"></div>
</section>
<div class="charbar" id="chars"></div>
<div class="tabs">
  <button class="tab active" data-mode="trace">① 描红</button>
  <button class="tab" data-mode="quiz">② 自己写＋批改</button>
  <button class="tab" data-mode="stroke">③ 看正确笔顺</button>
</div>

<div class="grid">
  <section class="card">
    <h2 id="leftTitle">描红</h2>
    <div class="stage gridbg" id="practiceStage"><div id="writer" class="writer"></div><canvas id="practiceCanvas"></canvas></div>
    <div class="hint" id="hint">沿着灰色笔画慢慢写</div>
    <div class="controls">
      <button class="primary" id="startBtn">开始练习</button><button class="secondary" id="finishBtn">✓ 完成这个字</button>
      <button class="secondary" id="clearBtn">清除</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2>正确笔顺示范</h2>
    <div class="word-info"><div class="bigchar" id="bigChar">昨</div><div class="pinyin" id="pinyin">zuó</div><button class="soundBtn" id="soundBtn" aria-label="播放读音">🔊</button></div>
    <div class="stage"><div id="strokeWriter" class="writer"></div></div>
    <div class="hint" id="strokeHint">第 1 笔开始</div>
    <div class="controls">
      <button class="primary" id="playBtn">▶ 播放笔顺</button>
      <button class="secondary" id="nextStrokeBtn">下一笔</button>
    </div>
  </section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script>
(function(){
'use strict';
const LIBRARY=[
{char:'昨',pinyin:'zuó',group:'P1-第一组'},{char:'明',pinyin:'míng',group:'P1-第一组'},
{char:'给',pinyin:'gěi',group:'P1-第一组'},{char:'快',pinyin:'kuài',group:'P1-第一组'},
{char:'乐',pinyin:'lè',group:'P1-第一组'},{char:'每',pinyin:'měi',group:'P1-第二组'},
{char:'兔',pinyin:'tù',group:'P1-第二组'},{char:'爪',pinyin:'zhǎo',group:'P1-第二组'},
{char:'尖',pinyin:'jiān',group:'P1-第二组'},{char:'园',pinyin:'yuán',group:'P1-第二组'},
{char:'我',pinyin:'wǒ',group:'常用'},{char:'你',pinyin:'nǐ',group:'常用'},
{char:'他',pinyin:'tā',group:'常用'},{char:'学',pinyin:'xué',group:'常用'},
{char:'校',pinyin:'xiào',group:'常用'},{char:'家',pinyin:'jiā',group:'常用'},
{char:'天',pinyin:'tiān',group:'常用'},{char:'大',pinyin:'dà',group:'常用'},
{char:'小',pinyin:'xiǎo',group:'常用'},{char:'人',pinyin:'rén',group:'常用'},
{char:'上',pinyin:'shàng',group:'常用'},{char:'下',pinyin:'xià',group:'常用'}
];
function loadSelected(){
  try{
    const a=JSON.parse(localStorage.getItem('jordanSelectedChars')||'[]'), seen=new Set();
    return a.filter(x=>x&&x.char&&!seen.has(x.char)&&seen.add(x.char));
  }catch(e){return [];}
}
let selectedChars=loadSelected().map(x=>LIBRARY.find(y=>y.char===x.char)||x).filter(Boolean);
let CHARS=selectedChars.length?selectedChars:LIBRARY.slice(0,10);
let current=0, mode='trace', writer=null, strokeWriter=null, quizActive=false, strokeNo=0;

const $=id=>document.getElementById(id);
const chars=$('chars');
function saveSelected(){try{localStorage.setItem('jordanSelectedChars',JSON.stringify(selectedChars));}catch(e){}}
function updateSelectedButton(){$('practiceSelectedBtn').textContent='练习已选（'+selectedChars.length+'）';}

async function addOnlineCharacter(){
  const input=$('addCharInput');
  const charsIn=Array.from(input.value.trim()).filter(c=>/[\u3400-\u9fff]/.test(c)).slice(0,10);
  if(!charsIn.length){
    $('status').textContent='请输入中文汉字，例如：龙';
    $('status').className='status bad'; return;
  }
  for(const char of charsIn){
    const existing=LIBRARY.find(x=>x.char===char);
    if(existing){
      if(!selectedChars.some(x=>x.char===char)) selectedChars.push(existing);
      continue;
    }
    let pinyin='';
    try{
      const r=await fetch('https://v2.alapi.cn/api/pinyin?text='+encodeURIComponent(char));
      if(r.ok){
        const d=await r.json();
        pinyin=d?.data?.pinyin||d?.pinyin||'';
      }
    }catch(e){}
    const item={char,pinyin,group:'我添加的字'};
    LIBRARY.push(item); selectedChars.push(item);
  }
  saveSelected(); renderLibrary(); input.value='';
  $('status').textContent='已加入生字库。重复的字不会再次添加；查不到拼音时不会乱显示。';
  $('status').className='status ok';
}
function stripTone(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}

const DAILY_TARGET=10;
function dateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function loadProgress(){
  try{return JSON.parse(localStorage.getItem('jordanDailyPractice')||'{}');}catch(e){return {};}
}
function saveProgress(p){try{localStorage.setItem('jordanDailyPractice',JSON.stringify(p));}catch(e){}}
function addDailyCompletion(char){
  const p=loadProgress(), key=dateKey();
  if(!p[key]) p[key]={chars:[],count:0};
  if(!p[key].chars.includes(char)){p[key].chars.push(char);p[key].count=p[key].chars.length;}
  saveProgress(p); renderCheckin();
}
function renderCheckin(){
  const p=loadProgress(),today=dateKey(), todayData=p[today]||{chars:[],count:0};
  const todayCount=todayData.chars?todayData.chars.length:(todayData.count||0);
  let total=0;
  Object.values(p).forEach(x=>{total+=x.chars?x.chars.length:(x.count||0);});
  const now=new Date(), monthPrefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  let month=0;Object.entries(p).forEach(([k,x])=>{if(k.startsWith(monthPrefix))month+=x.chars?x.chars.length:(x.count||0);});
  let streak=0;
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  while(true){
    const k=dateKey(d), x=p[k], n=x?(x.chars?x.chars.length:(x.count||0)):0;
    if(n>0){streak++;d.setDate(d.getDate()-1);}else break;
  }
  $('todayCount').textContent=todayCount;$('todayTarget').textContent=DAILY_TARGET;
  $('monthCount').textContent=month;$('totalCount').textContent=total;
  $('streak').textContent='连续 '+streak+' 天';
  $('dailyProgress').style.width=Math.min(100,todayCount/DAILY_TARGET*100)+'%';
  const grid=$('weekGrid');grid.innerHTML='';
  const names=['日','一','二','三','四','五','六'];
  for(let i=6;i>=0;i--){
    const x=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),k=dateKey(x),v=p[k],n=v?(v.chars?v.chars.length:(v.count||0)):0;
    const el=document.createElement('div');el.className='day '+(k===today?'active ':'')+(n>0?'complete':'');
    el.innerHTML='<div class="dow">周'+names[x.getDay()]+'</div><div class="num">'+x.getDate()+'</div><div class="done">'+(n?n+'字':'—')+'</div>';
    grid.appendChild(el);
  }
}
function renderLibrary(){
  const q=$('searchInput').value.trim().toLowerCase(), q2=stripTone(q), group=$('groupSelect').value, grid=$('libraryGrid');
  grid.innerHTML='';
  LIBRARY.filter(x=>(!q||x.char.includes(q)||x.pinyin.toLowerCase().includes(q)||stripTone(x.pinyin).includes(q2))&&(group==='all'||x.group===group)).forEach(item=>{
    const d=document.createElement('label'); const checked=selectedChars.some(x=>x.char===item.char);
    d.className='lib-item '+(checked?'selected':'');
    d.innerHTML='<input type="checkbox" '+(checked?'checked':'')+'><span class="hanzi">'+item.char+'</span><span class="py">'+item.pinyin+'</span>';
    d.querySelector('input').addEventListener('change',()=>toggleSelected(item));
    grid.appendChild(d);
  }); updateSelectedButton();
}
function toggleSelected(item){
  const i=selectedChars.findIndex(x=>x.char===item.char);
  if(i>=0)selectedChars.splice(i,1); else selectedChars.push(item);
  saveSelected();renderLibrary();
}
function visibleItems(){
  const q=$('searchInput').value.trim().toLowerCase(), q2=stripTone(q), group=$('groupSelect').value;
  return LIBRARY.filter(x=>(!q||x.char.includes(q)||x.pinyin.toLowerCase().includes(q)||stripTone(x.pinyin).includes(q2))&&(group==='all'||x.group===group));
}
function selectAllVisible(){visibleItems().forEach(x=>{if(!selectedChars.some(y=>y.char===x.char))selectedChars.push(x);});saveSelected();renderLibrary();}
function clearAll(){selectedChars=[];saveSelected();renderLibrary();}
function startSelectedPractice(){
  if(!selectedChars.length){$('status').textContent='请先在生字库选择至少一个字';$('status').className='status bad';return;}
  CHARS=selectedChars.slice();current=0;destroyWriters();renderCharBar();
  $('bigChar').textContent=CHARS[0].char;$('pinyin').textContent=CHARS[0].pinyin;strokeNo=0;renderMode();
}
function renderCharBar(){
  chars.innerHTML='';
  CHARS.forEach((item,i)=>{
    const b=document.createElement('button');b.className='charbtn'+(i===current?' active':'');
    b.innerHTML='<span>'+item.char+'</span><small>'+item.pinyin+'</small>';
    b.addEventListener('click',()=>selectChar(i));chars.appendChild(b);
  });
}




function safe(fn){
  try{return fn()}catch(e){console.error(e); return null}
}

function selectChar(i){
  current=i;
  document.querySelectorAll('.charbtn').forEach((b,n)=>b.classList.toggle('active',n===i));
  $('bigChar').textContent=CHARS[current].char;
  strokeNo=0;
  $('strokeHint').textContent='第 1 笔开始';
  destroyWriters();
  renderMode();
}

function destroyWriters(){
  safe(()=>writer && writer.cancelQuiz && writer.cancelQuiz());
  writer=null; strokeWriter=null; quizActive=false;
  $('writer').innerHTML='';
  $('strokeWriter').innerHTML='';
  $('practiceStage').classList.remove('trace-mode');
  $('practiceCanvas').style.display='none';
  const c=$('practiceCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
}

function makeStrokeWriter(){
  if(!window.HanziWriter) return false;
  strokeWriter=HanziWriter.create('strokeWriter',CHARS[current].char,{
    width:480,height:480,padding:8,showCharacter:false,showOutline:false,
    strokeAnimationSpeed:1.1,
    onLoadCharDataError:()=>{$('strokeHint').textContent='笔顺数据加载失败，请检查网络';}
  });
  return true;
}

function makeQuiz(){
  if(!window.HanziWriter){
    $('status').textContent='笔顺库还没加载，请检查网络后刷新';
    $('status').className='status bad';
    return;
  }
  writer=HanziWriter.create('writer',CHARS[current].char,{
    width:480,height:480,padding:8,showCharacter:false,showOutline:false,
    drawingWidth:18,showHintAfterMisses:2,highlightOnComplete:true,
    onLoadCharDataError:()=>{$('status').textContent='笔顺数据加载失败';$('status').className='status bad';}
  });
  writer.quiz({
    showHintAfterMisses:2,
    onCorrectStroke:d=>{
      $('status').textContent='✓ 第 '+(d.strokeNum+1)+' 笔正确！';
      $('status').className='status ok';
    },
    onMistake:d=>{
      $('status').textContent='再试一次这一笔 🙂';
      $('status').className='status bad';
    },
    onComplete:d=>{
      quizActive=false;
      addDailyCompletion(CHARS[current].char);
      $('status').textContent='🎉 全部写对了！今天已完成 '+(loadProgress()[dateKey()]?.chars?.length||1)+' 个字！';
      $('status').className='status ok';
    }
  });
  quizActive=true;
}

function makeTrace(){
  if(!window.HanziWriter){
    $('status').textContent='笔顺库还没加载，请检查网络后刷新';
    $('status').className='status bad';
    return;
  }
  $('practiceCanvas').style.display='block';
  $('practiceStage').classList.add('trace-mode');
  writer=HanziWriter.create('writer',CHARS[current].char,{
    width:480,height:480,padding:8,showCharacter:true,showOutline:false,
    strokeColor:'#b0bec5',outlineColor:'#cfd8dc',
    strokeAnimationSpeed:1
  });
  setupTraceCanvas();
}


function setupTraceCanvas(){
  const canvas=$('practiceCanvas'), stage=$('practiceStage');
  const rect=stage.getBoundingClientRect();
  const dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);
  canvas.style.width=rect.width+'px';
  canvas.style.height=rect.height+'px';
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.lineWidth=Math.max(6,rect.width*0.018);
  ctx.strokeStyle='#455a64';
  let drawing=false,last=null;

  function point(e){
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  canvas.onpointerdown=function(e){
    if(mode!=='trace') return;
    e.preventDefault();
    drawing=true; last=point(e);
    canvas.setPointerCapture?.(e.pointerId);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x,last.y);ctx.stroke();
  };
  canvas.onpointermove=function(e){
    if(!drawing) return;
    e.preventDefault();
    const q=point(e);
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    last=q;
  };
  canvas.onpointerup=canvas.onpointercancel=function(e){
    drawing=false;last=null;
  };
}

function clearTrace(){
  const canvas=$('practiceCanvas');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
}


function speakCurrent(){
  const item=CHARS[current];
  if(!('speechSynthesis' in window)){
    $('status').textContent='这个浏览器不支持朗读';
    $('status').className='status bad';
    return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(item.char);
  u.lang='zh-CN';
  u.rate=0.72;
  u.pitch=1;
  window.speechSynthesis.speak(u);
}
$('soundBtn').addEventListener('click',speakCurrent);
$('bigChar').addEventListener('click',speakCurrent);

function renderMode(){
  $('leftTitle').textContent=mode==='trace'?'描红':mode==='quiz'?'自己写＋批改':'笔顺示范';
  $('hint').textContent=mode==='trace'?'沿着浅灰色笔画写；点击 🔊 可以听读音':mode==='quiz'?'按正确笔顺写，写错会提示':'点击 🔊 听读音，右边播放正确笔顺';
  $('status').textContent='';
  $('status').className='status';
  $('practiceCanvas').style.display=mode==='trace'?'block':'none';
  $('practiceStage').classList.toggle('trace-mode',mode==='trace');
  if(mode==='trace') makeTrace();
  if(mode==='quiz') makeQuiz();
  if(mode==='stroke') makeStrokeWriter();
}

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click',()=>{
    mode=b.dataset.mode;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
    destroyWriters(); renderMode();
  });
});

$('playBtn').addEventListener('click',()=>{
  if(!strokeWriter) makeStrokeWriter();
  if(strokeWriter) {
    strokeNo=0;
    $('strokeHint').textContent='正在播放正确笔顺…';
    strokeWriter.animateCharacter({onComplete:()=>{$('strokeHint').textContent='完成！共 '+getStrokeCountHint()+' 笔';}});
  }
});

$('nextStrokeBtn').addEventListener('click',()=>{
  if(!strokeWriter) makeStrokeWriter();
  if(!strokeWriter) return;
  strokeWriter.animateStroke(strokeNo,{onComplete:()=>{}});
  strokeNo++;
  $('strokeHint').textContent='第 '+strokeNo+' 笔';
  if(strokeNo>20) strokeNo=0;
});

$('startBtn').addEventListener('click',()=>{
  if(mode==='quiz'){destroyWriters();makeQuiz();}
  else if(mode==='trace'){clearTrace();}
  else {makeStrokeWriter();}
});

$('clearBtn').addEventListener('click',()=>{
  if(mode==='quiz' && writer){ safe(()=>writer.cancelQuiz()); makeQuiz(); }
  else if(mode==='trace'){clearTrace();}
});

$('finishBtn').addEventListener('click',()=>{
  if(CHARS.length){addDailyCompletion(CHARS[current].char);$('status').textContent='✓ 已打卡：'+CHARS[current].char+'；今天完成 '+(loadProgress()[dateKey()]?.chars?.length||1)+' 个字';$('status').className='status ok';}
});
$('resetBtn').addEventListener('click',()=>{if(CHARS.length)selectChar(0);});

function getStrokeCountHint(){ return '多'; }

// Prevent iPad browser gestures inside practice area
document.querySelectorAll('.stage').forEach(el=>{
  el.addEventListener('touchstart',e=>{if(mode==='quiz')e.preventDefault()},{passive:false});
});

$('addCharBtn').addEventListener('click',addOnlineCharacter);
$('addCharInput').addEventListener('keydown',e=>{if(e.key==='Enter')addOnlineCharacter();});
$('searchInput').addEventListener('input',renderLibrary);
$('groupSelect').addEventListener('change',renderLibrary);
$('selectAllBtn').addEventListener('click',selectAllVisible);
$('clearAllBtn').addEventListener('click',clearAll);
$('practiceSelectedBtn').addEventListener('click',startSelectedPractice);
renderLibrary();
renderCheckin();
renderCharBar();
renderMode();
window.addEventListener('resize',()=>{if(mode==='trace') setupTraceCanvas();});
setInterval(renderCheckin,60000);
})();
</script>
</body>
</html>
