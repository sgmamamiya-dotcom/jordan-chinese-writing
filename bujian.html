<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>部件听写</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout concept: a night-sky game stage. A glass card on the left holds the sentence and pinyin,
   a glowing portal orb in the centre holds the 田字格 where parts snap in, and glossy candy tiles line the bottom.
   One deliberate dark look (no light theme): space is the setting. */
:root{
  color-scheme:dark;
  --night-0:#06030F; --night-1:#120A2E; --night-2:#241257;
  --magenta:#E8318F; --teal:#19C3B1; --blue:#2C5CE0; --violet:#7B3FE4;
  --ink:#FFFFFF; --ink-2:#C3BAEC; --ink-3:#8C81BE;
  --gold:#FFD25E; --good:#72F5B4; --bad:#FFAD5C;
  --glass:rgba(32,18,78,.66); --glass-2:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.17);
  --cta-a:#FF7BAA; --cta-b:#FF8F45; --cta-edge:#A5254F;
  --f-ui:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;
  --f-kai:"Kaiti SC","STKaiti","KaiTi","楷体","AR PL UKai CN","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html{background:#06030F}
body{
  margin:0;position:relative;min-height:100vh;overflow-x:clip;color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  background:
    radial-gradient(60vmax 50vmax at 12% 16%,rgba(232,49,143,.55),transparent 60%),
    radial-gradient(52vmax 40vmax at 58% -6%,rgba(25,195,177,.46),transparent 62%),
    radial-gradient(60vmax 50vmax at 96% 86%,rgba(44,92,224,.52),transparent 62%),
    radial-gradient(42vmax 40vmax at 28% 98%,rgba(123,63,228,.46),transparent 60%),
    var(--night-0);
  background-attachment:fixed;
  padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(56px,calc(env(safe-area-inset-bottom,0px) + 24px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8FB8FF;outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.planet{position:fixed;border-radius:50%;z-index:0;pointer-events:none}
.pl-blue{width:112px;height:112px;right:7%;top:110px;background:radial-gradient(circle at 32% 28%,#A5D4FF 0,#4382FF 45%,#1B2FA8 100%);box-shadow:inset -16px -18px 30px rgba(0,0,40,.5),0 0 44px rgba(80,140,255,.35)}
.pl-orange{width:92px;height:92px;right:4%;top:56%;background:radial-gradient(circle at 32% 28%,#FFD2A0 0,#F2893A 50%,#B24A1A 100%);box-shadow:inset -12px -14px 24px rgba(60,10,0,.45),0 0 34px rgba(255,150,70,.3)}
.pl-orange::after{content:"";position:absolute;left:-44%;right:-44%;top:36%;height:26%;border:3px solid rgba(255,236,170,.8);border-radius:50%;transform:rotate(-17deg)}
.pl-purple{width:72px;height:72px;left:3%;bottom:9%;background:radial-gradient(circle at 32% 28%,#D3A8FF 0,#7C45E0 55%,#3F1C98 100%);box-shadow:inset -10px -12px 20px rgba(20,0,60,.5)}
.pl-big{width:150px;height:150px;left:15%;top:64px;background:radial-gradient(circle at 34% 30%,#C9A0FF 0,#8445E6 55%,#3A1B90 100%);box-shadow:inset -18px -20px 36px rgba(20,0,60,.5)}
.pl-big::after{content:"";position:absolute;left:-60%;right:-60%;top:34%;height:34%;border:20px solid rgba(255,170,220,.42);border-radius:50%;transform:rotate(-14deg)}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto}

/* top bar */
.hud{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;padding-block:12px 16px}
.brand{display:flex;flex-direction:column;gap:2px}
.exit{align-self:flex-start;margin-bottom:4px;color:var(--ink-2);font-size:13px;font-weight:700;text-decoration:none}
.exit:hover{color:#fff}
.logo{font-family:var(--f-display);font-size:30px;line-height:1.05;letter-spacing:.06em;color:#FFE9A0;background:linear-gradient(90deg,#FFEBA6,#FFB4D8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ink-2)}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:rgba(20,12,56,.74);border:1px solid var(--glass-line);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.pill svg{width:22px;height:22px;fill:currentColor;flex:none}
.pill.bolt svg{color:var(--gold)}
.pill.cal svg{color:#FF9DB8}
.pill.who{cursor:pointer;font-family:inherit;font-size:16px;color:inherit}
.pill.who:hover{border-color:rgba(255,255,255,.5)}
.worlds.who{max-width:640px;margin-inline:auto}
.ring{position:relative;width:48px;height:48px;border-radius:50%;background:rgba(20,12,56,.74);border:1px solid var(--glass-line);display:grid;place-items:center}
.ring svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.ring b{position:relative;font-size:11px;font-weight:900;font-variant-numeric:tabular-nums}
.rbg{fill:none;stroke:rgba(255,255,255,.16);stroke-width:4}
.rfg{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(20,12,56,.74);display:grid;place-items:center;padding:0}
.rbtn svg{width:22px;height:22px;fill:currentColor}

/* home */
.hero{text-align:center;padding-block:8px 24px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,58px);line-height:1.2;letter-spacing:.04em;margin:0 0 10px;text-wrap:balance;text-shadow:0 4px 34px rgba(232,49,143,.5)}
.lead{margin:0 auto 18px;max-width:30em;color:var(--ink-2)}
.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.step{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:14.5px;font-weight:500}
.step b{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--f-kai);font-size:24px;line-height:1;color:#fff;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.5)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.world{appearance:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 18px 22px;border-radius:28px;background:linear-gradient(165deg,rgba(70,36,140,.62),rgba(24,12,66,.8));border:1px solid var(--glass-line);box-shadow:0 22px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(10px);transition:transform .15s,border-color .15s}
.world:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.42)}
.sphere{position:relative;flex:none;width:112px;height:112px;border-radius:50%}
.w1 .sphere{background:radial-gradient(circle at 32% 28%,#B2F1FF 0,#2FB8E8 42%,#1B4FC4 100%);box-shadow:inset -14px -16px 28px rgba(0,0,40,.45),0 0 38px rgba(60,180,255,.45)}
.w2 .sphere{background:radial-gradient(circle at 32% 28%,#FFD9A8 0,#F58E3C 48%,#B24A1A 100%);box-shadow:inset -14px -16px 28px rgba(60,10,0,.45),0 0 38px rgba(255,150,70,.4)}
.w2 .sphere::after{content:"";position:absolute;left:-36%;right:-36%;top:37%;height:26%;border:4px solid rgba(255,236,170,.85);border-radius:50%;transform:rotate(-16deg);box-shadow:0 0 14px rgba(255,220,140,.45)}
.w3 .sphere{background:radial-gradient(circle at 32% 28%,#FFC0E6 0,#E24FB0 46%,#7B2A9E 100%);box-shadow:inset -14px -16px 28px rgba(40,0,50,.45),0 0 38px rgba(255,100,190,.4)}
.w4 .sphere{background:radial-gradient(circle at 32% 28%,#D2FFC2 0,#4FD36F 46%,#15783F 100%);box-shadow:inset -14px -16px 28px rgba(0,40,10,.45),0 0 38px rgba(90,230,130,.4)}
.w5 .sphere{background:radial-gradient(circle at 32% 28%,#FFF5B0 0,#F5C93A 46%,#B27A0C 100%);box-shadow:inset -14px -16px 28px rgba(60,30,0,.45),0 0 38px rgba(255,210,90,.4)}
.w6 .sphere{background:radial-gradient(circle at 32% 28%,#E2D0FF 0,#9A6BF0 46%,#4B2A9E 100%);box-shadow:inset -14px -16px 28px rgba(20,0,60,.45),0 0 38px rgba(150,110,240,.4)}
.wname{display:block;font-family:var(--f-display);font-size:27px;line-height:1.2}
.wmeta{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.wprev{display:block;font-family:var(--f-kai);font-weight:700;font-size:28px;letter-spacing:.14em;margin-top:6px;text-shadow:0 0 14px rgba(255,255,255,.4)}
.world.locked{opacity:.62;border-style:dashed;cursor:default}
.world.locked:hover{transform:none;border-color:var(--glass-line)}
.world.locked .sphere{filter:grayscale(.85) brightness(.8)}
.zwrap{display:grid;gap:10px;grid-template-rows:1fr auto}
.zpick{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.zpick .btn{min-height:40px;padding:0 14px;font-size:14px}
.zpick select{font:inherit;font-size:16px;min-height:40px;border-radius:12px;padding:0 8px;background:rgba(255,255,255,.12);color:inherit;border:1px solid var(--glass-line)}
.zpick option{color:#222}
.note{margin:20px auto 0;max-width:40em;font-size:13.5px;line-height:1.8;color:var(--ink-2);text-align:center}
.tog{border:1px solid var(--glass-line);background:var(--glass-2);color:var(--ink-2);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;min-height:32px}
.tog.on{color:var(--gold);border-color:rgba(255,210,94,.55)}
.note .tog{margin-top:12px}

/* play */
.grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:28px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;padding:20px 20px 18px;border-radius:28px;background:linear-gradient(165deg,rgba(70,36,140,.64),rgba(24,12,66,.82));border:1px solid var(--glass-line);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(12px)}
.ptop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(25,195,177,.14);border:1px solid rgba(25,195,177,.55);color:#82F2E2;font-weight:700;font-size:14px}
.tag svg{width:16px;height:16px}
.bigpy{min-height:1.05em;text-align:center;font-weight:700;font-size:clamp(44px,8vw,60px);line-height:1.05;color:var(--gold);text-shadow:0 0 24px rgba(255,210,94,.38)}
.sentence{margin:0;text-align:center;font-family:var(--f-kai);font-weight:700;font-size:clamp(23px,5.4vw,28px);line-height:1.75}
.blank .box{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;line-height:1;vertical-align:middle;margin-inline:.1em;border:2px dashed rgba(255,255,255,.55);border-radius:8px;color:var(--gold)}
.blank.ok .box{border-color:transparent;text-shadow:0 0 16px rgba(255,210,94,.85)}
.listen{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}
.sbtn{width:60px;height:60px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;color:#06303A;background:linear-gradient(180deg,#6BEBE4,#17AFC4);box-shadow:0 5px 0 #0C6E85,0 12px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.sbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #0C6E85,0 6px 12px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55)}
.sbtn svg{width:28px;height:28px;fill:currentColor}
.sml{display:flex;gap:8px;flex-wrap:wrap}
.abtn{border:1px solid var(--glass-line);background:var(--glass-2);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:700;font-size:14px}
.dots{display:flex;gap:6px;margin-top:2px}
.dots i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.15)}
.dots i.ok{background:linear-gradient(90deg,#5FE7E0,#B38CFF)}
.dots i.now{flex:2;background:linear-gradient(90deg,#FF7BC0,#FF9A6B)}

.orbwrap{display:flex;flex-direction:column;min-width:0}
.hint{display:flex;align-items:center;gap:14px;width:100%;max-width:560px;margin:0 auto 20px;padding:12px 20px 12px 12px;border-radius:22px;background:linear-gradient(180deg,rgba(44,28,98,.92),rgba(22,14,60,.92));border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mascot{flex:none;width:52px;height:52px}
.mascot svg{width:100%;height:100%;display:block}
.hint b{display:block;font-size:18px;line-height:1.3}
.hint b.good{color:var(--good)}
.hint b.bad{color:var(--bad)}
.hint small{display:block;font-size:13.5px;color:var(--ink-2)}
.orb{container-type:inline-size;position:relative;width:min(calc(100% - 28px),clamp(270px,50vh,430px));aspect-ratio:1;margin:8px auto 6px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(150,210,255,.34) 0,rgba(112,90,230,.52) 55%,rgba(52,28,120,.74) 100%);
  box-shadow:0 0 0 6px rgba(255,255,255,.92),0 0 0 10px rgba(190,240,255,.42),0 0 70px 12px rgba(190,140,255,.55),inset 0 0 70px rgba(255,255,255,.22)}
.swirl{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.swirl::before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,255,255,.3) 17%,transparent 30% 52%,rgba(130,255,240,.28) 66%,transparent 80%);animation:spin 26s linear infinite;animation-delay:var(--ph,0s)}
.orb.win::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,226,140,.95);pointer-events:none;animation:ripple .9s ease-out both}
.sp{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .9s ease-out both}
.frame{container-type:size;position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:14px;border:2px solid rgba(255,255,255,.34);background:rgba(255,255,255,.05);box-shadow:inset 0 0 30px rgba(255,255,255,.08)}
.frame::before,.frame::after{content:"";position:absolute;pointer-events:none;border:0 dashed rgba(255,255,255,.22)}
.frame::before{left:0;right:0;top:50%;border-top-width:1.5px}
.frame::after{top:0;bottom:0;left:50%;border-left-width:1.5px}
.slot{position:absolute;display:flex;align-items:center;justify-content:center;appearance:none;border:0;padding:0;background:transparent;border-radius:10px;
  font-family:var(--f-kai);font-weight:700;line-height:1;color:#fff;text-shadow:0 0 16px rgba(255,255,255,.65),0 2px 0 rgba(30,10,70,.5)}
.slot .lab{font:700 13px/1 var(--f-ui);color:rgba(255,255,255,.62);text-shadow:none}
.slot.empty{background:rgba(255,255,255,.09);outline:2px dashed rgba(255,255,255,.5);outline-offset:-2px}
.slot.empty.active{outline-color:var(--gold);background:rgba(255,210,94,.15);box-shadow:0 0 18px rgba(255,210,94,.35)}
.slot.locked{color:#C4FFE3;text-shadow:0 0 18px rgba(114,245,180,.8)}
.slot.bad{animation:shake .45s;color:var(--bad);text-shadow:0 0 16px rgba(255,173,92,.7)}
.slot.pop{animation:pop .28s ease-out}
.slot.shell.empty{outline:none;background:transparent;border:0 dashed rgba(255,255,255,.5);border-radius:4px;box-shadow:none}
.slot.shell.empty.b-all{border-width:2px}
.slot.shell.empty.b-lb{border-left-width:2px;border-bottom-width:2px}
.slot.shell.empty.b-lt{border-left-width:2px;border-top-width:2px}
.slot.shell.empty.active{border-color:var(--gold)}
.slot.shell .lab{position:absolute;left:8px;top:8px}
.slot.shell.b-lb .lab{top:auto;bottom:8px}
.full{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-kai);font-weight:700;font-size:86cqw;line-height:1;color:#fff;text-shadow:0 0 20px #FFD25E,0 0 48px #FF6FB5;animation:merge .5s ease both}

.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;margin-top:26px}
.c0{--t1:#DC8CFF;--t2:#A545E8;--edge:#6A20A6}
.c1{--t1:#FF8AD6;--t2:#E03BA8;--edge:#96166D}
.c2{--t1:#FFC080;--t2:#F08A38;--edge:#A04C0D}
.c3{--t1:#F5F78F;--t2:#CBD748;--edge:#8A901E}
.c4{--t1:#AEF5A2;--t2:#55CC6A;--edge:#2A7F3F}
.c5{--t1:#94EDFF;--t2:#36B8E6;--edge:#1A6C95}
.tile{position:relative;width:clamp(58px,13vw,88px);aspect-ratio:1;padding:0;border:0;border-radius:26%;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--t1),var(--t2));
  box-shadow:0 8px 0 var(--edge),0 16px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -10px 18px rgba(0,0,0,.12);
  font-family:var(--f-kai);font-weight:700;font-size:clamp(32px,7.2vw,50px);line-height:1;color:#fff;
  text-shadow:0 0 12px rgba(255,255,255,.7),0 2px 0 rgba(60,20,100,.35);
  -webkit-text-stroke:2px rgba(70,24,120,.5);paint-order:stroke fill;
  transform:rotate(var(--rot,0deg));transition:transform .1s,box-shadow .1s,opacity .15s}
.tile::before{content:"";position:absolute;left:12%;top:8%;width:46%;height:22%;border-radius:50%;background:rgba(255,255,255,.34);transform:rotate(-12deg);pointer-events:none}
.tile:hover{transform:rotate(var(--rot,0deg)) translateY(-3px)}
.tile:active{transform:rotate(var(--rot,0deg)) translateY(5px);box-shadow:0 3px 0 var(--edge),0 8px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.tile[disabled]{opacity:.22;transform:scale(.92);box-shadow:none;cursor:default}
.tile.glow{animation:glow .9s ease 3}
.tile.two{font-size:clamp(22px,4.8vw,32px);letter-spacing:-.08em}
.mt.two{font-size:17px;letter-spacing:-.08em}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
.btn{min-height:50px;padding:12px 26px;border-radius:999px;font-weight:900;font-size:17px;border:1px solid var(--glass-line);background:var(--glass)}
.btn.cta{border:0;color:#fff;background:linear-gradient(180deg,var(--cta-a),var(--cta-b));box-shadow:0 5px 0 var(--cta-edge),0 14px 26px rgba(255,90,140,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(120,20,50,.45);min-width:150px}
.btn.cta:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 var(--cta-edge),0 8px 16px rgba(255,90,140,.3),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.ghost{background:transparent;font-weight:500;color:var(--ink-2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.done{display:grid;justify-items:center;gap:14px;margin-top:26px;text-align:center}
.stars{font-size:40px;letter-spacing:.12em;line-height:1;color:var(--gold);text-shadow:0 0 20px rgba(255,210,94,.7)}
.stars .off{color:rgba(255,255,255,.18);text-shadow:none}
.gain{font-weight:900;font-size:18px;color:var(--gold)}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-weight:900;font-size:24px;color:var(--ink-2)}
.mt{display:grid;place-items:center;width:52px;height:52px;border-radius:26%;font-family:var(--f-kai);font-weight:700;font-size:30px;line-height:1;color:#fff;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 4px 0 var(--edge),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 0 10px rgba(255,255,255,.6);-webkit-text-stroke:1.5px rgba(70,24,120,.5);paint-order:stroke fill}
.mt.big{width:62px;height:62px;font-size:38px}
.word{font-size:14.5px;color:var(--ink-2)}

function startRound(mode){
  S.mode=mode;
  var wk=(typeof mode==='string'&&mode!=='review'),pool;
  if(mode==='review'){var seen={},rl=reviewList();pool=charsOf(S.player).filter(function(c){if(rl.indexOf(c.ch)<0||seen[c.ch])return false;seen[c.ch]=1;return true;});}
  else pool=CHARS.filter(function(c){return c.lv===mode;});
  S.queue=wk?pool:shuffle(pool).slice(0,10);S.i=0;S.results=[];S.gained=0;
  S.view='play';S.q=makeQ(S.queue[0]);render();window.scrollTo(0,0);
  speak(fullSentence(S.q.item),0.85);
}
function fullSentence(it){return it.sent.replace('{}',it.ch);}
function makeQ(it){
  var tiles=shuffle(it.parts.concat(it.decoys).map(function(ch,id){return {id:id,ch:ch};}));
  var cols=shuffle([0,1,2,3,4,5]);
  tiles.forEach(function(t,k){t.col=cols[k%6];t.rot=(Math.random()*8-4).toFixed(1);});
  return {item:it,tiles:tiles,slots:it.parts.map(function(){return null;}),locked:it.parts.map(function(){return false;}),
    active:0,attempts:0,hints:0,solved:false,busy:false,revealed:false,glow:null,pop:null,bad:[],stars:0,
    msg:{t:'听一听，找出它的部件吧！',k:''}};
}
function tileCh(q,id){for(var i=0;i<q.tiles.length;i++)if(q.tiles[i].id===id)return q.tiles[i].ch;return '';}
function firstFree(q){for(var i=0;i<q.slots.length;i++)if(q.slots[i]===null&&!q.locked[i])return i;return -1;}

function placeTile(id){
  var q=S.q;if(q.solved||q.busy||q.slots.indexOf(id)>=0)return;
  var t=(q.slots[q.active]===null&&!q.locked[q.active])?q.active:firstFree(q);
  if(t<0)return;
  q.slots[t]=id;q.pop=t;q.glow=null;
  var nx=firstFree(q);q.active=nx<0?t:nx;
  q.msg={t:q.slots.every(function(v){return v!==null;})?'都放好了，点「检查」！':'很好，再选一个部件。',k:''};
  render();q.pop=null;
}
function tapSlot(i){
  var q=S.q;if(q.solved||q.busy||q.locked[i])return;
  if(q.slots[i]!==null)q.slots[i]=null;
  q.active=i;render();
}
function check(){
  var q=S.q,it=q.item;if(q.solved||q.busy)return;
  var wrong=[];
  q.slots.forEach(function(id,i){
    if(q.locked[i])return;
    if(tileCh(q,id)===it.parts[i])q.locked[i]=true;else wrong.push(i);
  });
  if(!wrong.length){solve();return;}
  q.attempts++;q.bad=wrong;q.busy=true;
  q.msg={t:(wrong.length<q.slots.length?'绿色的对了！其余 '+wrong.length+' 个再想想。':'部件或位置不对，再想想。'),k:'bad'};
  render();
  setTimeout(function(){
    wrong.forEach(function(i){q.slots[i]=null;});
    q.bad=[];q.busy=false;q.active=wrong[0];
    q.msg={t:'不对的部件已退回，再试一次。',k:''};render();
  },700);
}
function hint(){
  var q=S.q,it=q.item;if(q.solved||q.busy)return;
  var i=-1;
  for(var k=0;k<q.slots.length;k++){
    if(q.locked[k])continue;
    if(q.slots[k]===null||tileCh(q,q.slots[k])!==it.parts[k]){i=k;break;}
  }
  if(i<0)return;
  if(q.slots[i]!==null)q.slots[i]=null;
  q.active=i;q.hints++;
  var want=it.parts[i],tid=null;
  q.tiles.forEach(function(t){if(tid===null&&t.ch===want&&q.slots.indexOf(t.id)<0)tid=t.id;});
  q.glow=tid;
  q.msg={t:'发光的部件放在「'+STRUCT[it.st].labels[i]+'」格。',k:''};
  render();
}
function reveal(){
  var q=S.q,it=q.item;if(q.solved||q.busy)return;
  q.slots=q.slots.map(function(){return null;});
  it.parts.forEach(function(ch,i){
    var tid=null;q.tiles.forEach(function(t){if(tid===null&&t.ch===ch&&q.slots.indexOf(t.id)<0)tid=t.id;});
    q.slots[i]=tid;q.locked[i]=true;
  });
  q.revealed=true;solve();
}
function solve(){
  var q=S.q,it=q.item;
  q.solved=true;q.busy=false;q.bad=[];
  q.stars=q.revealed?1:Math.max(1,3-q.attempts-q.hints);
  S.results.push({ch:it.ch,stars:q.stars});
  var idx=S.review.indexOf(it.ch),zc=S.player==='bryan'?ZIBY[it.ch]:null;
  if(zc){
    // 必考字：和「必考字练习」一样，错了放进错字本，再对两次才拿掉。
    var zs=readZi(),st=zs.stats[zc.n]||(zs.stats[zc.n]={ok:0,bad:0});
    if(q.stars<3){st.bad++;zs.wrong[zc.n]=2;}
    else{st.ok++;if(zs.wrong[zc.n]){zs.wrong[zc.n]--;if(zs.wrong[zc.n]<=0)delete zs.wrong[zc.n];}}
    writeZi(zs);if(idx>=0)S.review.splice(idx,1);
  }
  else if(q.stars<3){if(idx<0)S.review.push(it.ch);}
  else if(S.mode==='review'&&idx>=0){S.review.splice(idx,1);}
  q.gain=q.stars*5;S.gained+=q.gain;S.energy+=q.gain;touchStreak();
  save(true);
  q.msg={t:q.stars===3?'太棒了，一次拼对！':'拼对了！',k:'good'};
  render();
}

    '<div class="world w3 locked"><span class="sphere"></span><span><span class="wname">复习星</span><span class="wmeta">还没有字。看过答案或没拿满三星的字会飞到这里。</span></span></div>';
  var ws,note;
  if(S.player==='bryan'){
    var b1=pick('b1'),b2=pick('b2'),b3=pick('b3');
    ws=world('w4','b1','词语 1–8',b1.length+' 个字 · 第十六课听写',prev(b1))+
       world('w5','b2','句子 9–13',b2.length+' 个字 · 第十六课听写',prev(b2))+
       world('w1','b3','作文补药',b3.length+' 个字 · 默写：天下无难事……',prev(b3))+zw()+reviewW;
    note='必考字和「必考字练习」用同一个字库，也是每 10 个字号一组，错字也共用一个错字本：这里拼错的字会进「必考字练习」的错字本，错字本里的字也会出现在复习星，要再拼对两次才拿掉。'+(350-ZI.length)+' 个字（像「争、严、束」）没有好拼的部件，所以跳过了。第十六课只放了单子上画线、并且能用部件拼出来的字。与、丑没有可拼的部件，请直接写在本子上。没画线的字也要在本子上写。';
  }else{
    var k1=pick('w1'),k2=pick('w2'),l1=pick(1),l2=pick(2);
    var x1=pick('x1'),x2=pick('x2');
    ws=world('w4','x1','听写一 · 4.8',x1.length+' 个字 · 作文句子：她们买了鱼、肉和青菜……',prev(x1))+
       world('w6','x2','听写二 · 4.8',x2.length+' 个字 · 皮球、垃圾、美丽、飞机……',prev(x2))+
       world('w1','w1','听写一 · 4.6',k1.length+' 个字 · 作文句子：过后，文丽和文乐……',prev(k1))+
       world('w5','w2','听写二 · 4.6',k2.length+' 个字 · 第十六到十九课词语复习',prev(k2))+
       world('w1',1,'入门星',l1.length+' 个字 · 青字家族、左右结构、半包围',prev(l1))+
       world('w2',2,'进阶星',l2.length+' 个字 · 上下、左中右、更多半包围',prev(l2))+reviewW;
    note='本周（4.8）：桌、买、了、鱼、肉、青、东、西、走、大、小、皮、子、丽、开、车、上、学、飞、生、气、手、工、中这些字没有好拼的部件，请直接写在本子上；「做手工」「天空中」只考做、天、空。上面两颗是 4.8，下面是之前的。听写一、听写二按本周练习单的顺序出题，只放了能用部件拼出来的字。后、文、丽、乐、看、电、干、天、上、走、间、美、常、步、书这 15 个字没有好拼的部件，请直接写在本子上。听写二第 1–6 个（蛇、电梯、浇花、超市、动物、赏月）在括号里，不听写，所以没放进来。';
  }
  return ''+
  '<section class="hero"><h1>听一句话，<br>拼出一个字</h1>'+
    '<p class="lead">每题读一句完整的话，把部件放进田字格拼出空格里的字，再在本子上写一遍。</p>'+
    '<div class="steps"><div class="step c0"><b>听</b>听整句，看拼音</div><div class="step c1"><b>拼</b>把部件放进格子</div><div class="step c4"><b>写</b>在本子上写一遍</div></div></section>'+
  '<div class="worlds">'+ws+'</div>'+
  '<p class="note">'+note+'</p>'+
  '<p class="note" id="cloud">'+(window.Progress?Progress.label():'进度只存在这台设备')+'</p>'+
  '<p class="note">'+(voiceOk?'声音来自设备自带的中文语音，偶尔会读错，每题都有完整句子和拼音可以对照。':'这台设备没有找到中文语音，请看句子和拼音。')+'<br>'+tog()+'</p>';
}

function who(){
  function card(p){var P=PLAYERS[p],pv=CHARS.filter(function(c){return c.lv===P.pv;}).slice(0,5).map(function(c){return c.ch;}).join('');
    return '<button class="world '+P.cls+'" data-a="pick" data-p="'+p+'"><span class="sphere"></span><span><span class="wname">'+P.name+'</span><span class="wmeta">'+P.sub+'</span><span class="wprev">'+pv+'</span></span></button>';}
  return '<section class="hero"><h1>谁来练习？</h1><p class="lead">Bryan 和 Jordan 各有自己的听写、能量、连续天数和复习星，互不影响。</p></section>'+
    '<div class="worlds who">'+card('bryan')+card('jordan')+'</div>';
}

function play(){
  var q=S.q,it=q.item,st=STRUCT[it.st],total=S.queue.length;
  var dots=S.queue.map(function(_,k){return '<i class="'+(k<S.i||(k===S.i&&q.solved)?'ok':k===S.i?'now':'')+'"></i>';}).join('');
  var parts=it.sent.split('{}');
  var blank='<span class="blank'+(q.solved?' ok':'')+'"><span class="box">'+(q.solved?it.ch:'')+'</span></span>';
  var frame;
  if(q.solved){frame='<div class="full">'+it.ch+'</div>';}
  else{
    frame=st.slots.map(function(g,i){
      var id=q.slots[i],ch=id===null?'':tileCh(q,id);
      var cls=['slot',id===null?'empty':'',(i===q.active&&id===null)?'active':'',(i===0&&st.shell)?'shell '+st.shell:'',q.locked[i]?'locked':'',q.bad.indexOf(i)>=0?'bad':'',q.pop===i?'pop':''].join(' ');
      var style='left:'+g[0]+'%;top:'+g[1]+'%;width:'+g[2]+'%;height:'+g[3]+'%;font-size:'+(ch.length>1?g[4]*0.55:g[4])+'cqw;z-index:'+((i===0&&st.shell)?1:2);
      return '<button class="'+cls+'" style="'+style+'" data-a="slot" data-i="'+i+'" aria-label="'+st.labels[i]+'格'+(ch?'，已放'+ch:'，空')+'">'+(ch||'<span class="lab">'+st.labels[i]+'</span>')+'</button>';
    }).join('');
  }
  var sparks='';
  if(q.solved){for(var k=0;k<12;k++)sparks+='<i class="sp" style="--a:'+(k*30)+'deg;--d:'+(34+(k%3)*7)+'cqw"></i>';}
  var ph=((typeof performance!=='undefined'?performance.now():0)/1000)%26;
  var orb='<div class="orb'+(q.solved?' win':'')+'" style="--ph:-'+ph.toFixed(2)+'s"><div class="swirl"></div><div class="frame" role="group" aria-label="田字格">'+frame+'</div>'+sparks+'</div>';
  var bottom;
  if(!q.solved){
    var ready=q.slots.every(function(v){return v!==null;});
    var tiles=q.tiles.map(function(t){
      var used=q.slots.indexOf(t.id)>=0;
      return '<button class="tile c'+t.col+(t.ch.length>1?' two':'')+(q.glow===t.id?' glow':'')+'" style="--rot:'+t.rot+'deg" data-a="tile" data-id="'+t.id+'"'+(used?' disabled':'')+' aria-label="部件 '+t.ch+'">'+t.ch+'</button>';
    }).join('');
    bottom='<div class="tray">'+tiles+'</div>'+
      '<div class="actions">'+
        '<button class="btn" data-a="hint"'+(q.busy?' disabled':'')+'>提示</button>'+
        '<button class="btn cta" data-a="check"'+((!ready||q.busy)?' disabled':'')+'>检查</button>'+
        '<button class="btn ghost" data-a="reveal"'+(q.busy?' disabled':'')+'>看答案</button>'+
      '</div>';
  }else{
    var eq=it.parts.map(function(ch,i){return (i?'<span>+</span>':'')+'<span class="mt c'+((i*2+1)%6)+(ch.length>1?' two':'')+'">'+ch+'</span>';}).join('');
    bottom='<div class="done">'+
      '<div class="stars" role="img" aria-label="'+q.stars+' 星">'+stars(q.stars)+'</div>'+
      '<div class="gain">能量 +'+q.gain+'</div>'+
      '<div class="eq">'+eq+'<span>=</span><span class="mt big c2">'+it.ch+'</span></div>'+
      '<div class="word">词语：'+it.word+'</div>'+
      '<div class="write">拿出练习本，把「'+it.ch+'」工整地写一遍。</div>'+
      '<button class="btn cta" data-a="next">'+(S.i<total-1?'我写好了，下一个':'我写好了，看成绩')+'</button>'+
    '</div>';
  }
  return ''+
  '<div class="grid">'+
    '<aside class="panel">'+
      '<div class="ptop"><span class="tag">'+SQ+st.name+'</span>'+tog()+'</div>'+
      '<div class="bigpy">'+((S.pinyin||q.solved)?it.py:'···')+'</div>'+
      '<p class="sentence">'+parts[0]+blank+parts[1]+'</p>'+
      '<div class="listen"><button class="sbtn" data-a="say" data-k="sent" aria-label="听整句">'+SPK+'</button>'+
        '<div class="sml"><button class="abtn" data-a="say" data-k="slow">慢速</button><button class="abtn" data-a="say" data-k="word">听词语</button></div></div>'+
      '<div class="dots" aria-hidden="true">'+dots+'</div>'+
    '</aside>'+
    '<section class="orbwrap">'+
      '<div class="hint"><span class="mascot">'+MASCOT+'</span><div><b class="'+q.msg.k+'" role="status" aria-live="polite">'+q.msg.t+'</b><small>'+st.tip+'</small></div></div>'+
      orb+
    '</section>'+
  '</div>'+bottom;
}

function result(){
  var tot=S.results.reduce(function(a,r){return a+r.stars;},0),max=S.results.length*3;
  var weak=S.results.filter(function(r){return r.stars<3;}).length;
  var cells=S.results.map(function(r,k){return '<div class="cell'+(r.stars<3?' weak':'')+'"><span class="mt c'+(k%6)+'">'+r.ch+'</span><div class="stars" role="img" aria-label="'+r.stars+' 星">'+stars(r.stars)+'</div></div>';}).join('');
  return ''+
  '<section class="rcard">'+
    '<h2>本轮完成！</h2>'+
    '<div class="score">'+tot+'<small> / '+max+' 星</small></div>'+
    '<p>能量 +'+S.gained+'　·　'+(weak?weak+' 个字没拿满三星，已放进复习星（粉框）。':'全部一次拼对！')+'</p>'+
    '<div class="cells">'+cells+'</div>'+
    '<div class="actions" style="margin-top:6px">'+
      '<button class="btn cta" data-a="start" data-m="'+S.mode+'">再来一组</button>'+
      (/^z/.test(S.mode)&&ZG.indexOf(S.zg)<ZG.length-1?'<button class="btn" data-a="znext">下一组 ›</button>':'')+
      (reviewList().length&&S.mode!=='review'?'<button class="btn" data-a="start" data-m="review">练复习星（'+reviewList().length+'）</button>':'')+
      '<button class="btn ghost" data-a="home">回首页</button>'+
    '</div>'+
  '</section>';
}

function render(){
  var ae=document.activeElement,sel=null;
  if(ae&&app.contains(ae)&&ae.dataset&&ae.dataset.a){
    var d=ae.dataset;
    sel='[data-a="'+d.a+'"]'+['id','i','k','m'].map(function(n){return d[n]!==undefined?'[data-'+n+'="'+d[n]+'"]':'';}).join('');
  }
  app.innerHTML=hud()+(S.view==='who'?who():S.view==='home'?home():S.view==='play'?play():result());
  if(sel){var el=app.querySelector(sel);if(el&&!el.disabled){try{el.focus({preventScroll:true});}catch(e){}}}
}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a;
  if(a==='start'){var m=b.dataset.m;startRound(/^[0-9]+$/.test(m)?parseInt(m,10):m);}
  else if(a==='home'){try{speechSynthesis.cancel();}catch(x){}S.view='home';render();}
  else if(a==='who'){try{speechSynthesis.cancel();}catch(x){}S.view='who';render();window.scrollTo(0,0);}
  else if(a==='pick'){loadPlayer(b.dataset.p);save();S.view='home';render();window.scrollTo(0,0);}
  else if(a==='sound'){S.sound=!S.sound;if(!S.sound){try{speechSynthesis.cancel();}catch(x){}}save();render();}
  else if(a==='pinyin'){S.pinyin=!S.pinyin;save();render();}
  else if(a==='zg'){var k=ZG.indexOf(S.zg)+parseInt(b.dataset.d,10);if(k>=0&&k<ZG.length){S.zg=ZG[k];save(true);render();}}
  else if(a==='znext'){var k2=ZG.indexOf(S.zg)+1;if(k2<ZG.length){S.zg=ZG[k2];save(true);startRound('z'+S.zg);}}
  else if(a==='tile')placeTile(parseInt(b.dataset.id,10));
  else if(a==='slot')tapSlot(parseInt(b.dataset.i,10));
  else if(a==='check')check();
  else if(a==='hint')hint();
  else if(a==='reveal')reveal();
  else if(a==='next')next();
  else if(a==='say'){
    var it=S.q.item,k=b.dataset.k;
    if(k==='sent')speak(fullSentence(it),0.85);
    else if(k==='slow')speak(fullSentence(it),0.5);
    else speak(it.word,0.7);
  }
});

if(window.Progress)Progress.onStatus(function(){var c=document.getElementById('cloud');if(c)c.textContent=Progress.label();});
app.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.a==='zsel'){S.zg=parseInt(e.target.value,10);save(true);render();}
});
render();
})();
</script>
</body>
</html>
