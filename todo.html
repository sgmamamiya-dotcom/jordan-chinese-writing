<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>This Week's To-do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="hub.css">
<style>
.banner{background:var(--yellow);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-weight:700;margin:0 0 18px}
.kids{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.kids button{font:700 17px var(--body);min-height:48px;padding:0 22px;border-radius:999px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.kids button[aria-pressed="true"]{background:var(--ink);color:#fff}
.progress{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.progress .count{font-family:var(--display);font-weight:800;font-size:24px;white-space:nowrap}
.bar{flex:1;height:16px;border-radius:999px;border:3px solid var(--ink);background:#fff;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--mint);transition:width .25s}
.day{margin-top:28px}
.day h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.15;margin:0}
.day .sub{color:var(--mute);margin:2px 0 12px;font-size:16px}
.list{display:flex;flex-direction:column;gap:14px}
.task{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.box{width:44px;height:44px;padding:0;border-radius:14px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.box svg{width:26px;height:26px;opacity:0}
.task.done .box{background:var(--mint)}
.task.done .box svg{opacity:1}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.task.done .note{opacity:.7}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:4px}
.who{font-weight:700;font-size:14px;padding:1px 12px;border-radius:999px;border:2px solid var(--ink)}
.who.bryan{background:var(--purple);border-color:var(--purple);color:#fff}
.who.jordan{background:var(--mint);border-color:var(--mint);color:var(--ink)}
.subj{font-weight:700;font-size:15px;color:var(--mute)}
.t{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.2;overflow-wrap:anywhere}
.note{margin:4px 0 0;color:var(--mute);font-size:16px}
.go{display:inline-block;margin-top:8px;font-weight:700;color:var(--purple)}
.empty{margin-top:28px;padding:22px;border:3px dashed var(--ink);border-radius:20px;text-align:center;color:var(--mute)}
.foot{margin-top:36px;color:var(--mute);font-size:15px}
@media(prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="index.html">← Home</a>
  <h1>This week's to-do</h1>
  <p class="hello" id="hello"></p>

  <div class="banner">Mon–Wed (12–14 Oct) are home days. Start your school work early and finish it early.</div>

  <div class="kids" role="group" aria-label="Show tasks for">
    <button type="button" data-kid="all" aria-pressed="true">Both</button>
    <button type="button" data-kid="bryan" aria-pressed="false">Bryan</button>
    <button type="button" data-kid="jordan" aria-pressed="false">Jordan</button>
  </div>

  <div class="progress" aria-live="polite">
    <span class="count" id="count"></span>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
  </div>

  <div id="board"></div>

  <p class="foot" id="foot"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* To update: edit UPDATED, GROUPS and TASKS below. Ticks are saved online (Supabase table todo_checks, see supabase/todo_checks.sql) with a copy on each device. */
var UPDATED = 'Sat 10 Oct';

var GROUPS = [
  { id: 'rev',  title: 'This weekend to Wed 14 Oct', sub: 'English Paper 2 revision. Plan your own time for these.' },
  { id: 'sun',  title: 'Sunday 11 Oct',     sub: 'Get ready' },
  { id: 'mon',  title: 'Monday 12 Oct',     sub: 'Home day' },
  { id: 'tue',  title: 'Tuesday 13 Oct',    sub: 'Home day' },
  { id: 'wed',  title: 'Wednesday 14 Oct',  sub: 'Home day' },
  { id: 'week', title: 'Home learning week', sub: 'No exact day from the teacher. Finish as early as you can.' }
];

var TASKS = [
  { id: 'b-en-verbs', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Watch the verbs videos, Lessons 1 to 5',
    note: "They're on your English teacher's Google Classroom. Catch up on any you missed." },
  { id: 'b-en-irregular', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Memorise the irregular verbs list',
    note: 'Chant it again and again until you know it by heart.' },
  { id: 'b-en-spell', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Learn the words on the blue Spelling List' },
  { id: 'b-en-spellgame', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Spelling Game Challenge',
    note: 'Start at P4. Play as many rounds as you like, because the words change each round. Move up a level once you clear all the P4 words.',
    link: 'https://tinyurl.com/MCspell', linkText: 'Open the spelling game →' },
  { id: 'b-en-spell-extra', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Add the words you got wrong to your Spelling List',
    note: "Flip through your Spelling and Editing Practices. Write every word you couldn't spell on foolscap paper and staple it behind the blue Spelling List." },
  { id: 'b-en-wa2', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Revise the WA2 papers in your red file',
    note: 'Go over the strategies for Tense Sequence, Cloze Passage, Comprehension, Grammar Drills and Synthesis & Transformation. Then look through all the WA2 practice and exam papers for the mistakes you made.' },
  { id: 'b-en-notes', kid: 'bryan', group: 'rev', subject: 'English',
    title: 'Make revision notes from your mistakes',
    note: "Write them on foolscap paper and staple the pages together, or start a revision exercise book. This helps you not make the same mistakes again." },

  { id: 'b-prep', kid: 'bryan', group: 'sun', subject: 'Math',
    title: 'Find your Math file and practice papers',
    note: 'Look at the cover page of each paper to see how long it takes. PP3A and PP3B came last week. More papers come home by the end of this week.' },
  { id: 'j-login', kid: 'jordan', group: 'sun', subject: 'Chinese',
    title: 'Try logging in to ezhishi.net',
    note: 'Make sure it works before next week.',
    link: 'https://ezhishi.net', linkText: 'Open ezhishi.net →' },

  { id: 'b-pp2b', kid: 'bryan', group: 'mon', subject: 'Math',
    title: 'Finish PP2B (2024 Paper 2)',
    note: 'Time yourself with the duration on the cover page. Do it on your own.' },
  { id: 'b-en-pa', kid: 'bryan', group: 'mon', subject: 'English',
    title: 'English Practice A (1 hour only)',
    note: "Do Sections A to F only. Skip Section G (Comprehension). Section B: look up the options in a dictionary and write down what they mean. S&T Q4: answer it using logic. The 'if (condition)' structure doesn't work for this one." },

  { id: 'b-pp1a', kid: 'bryan', group: 'tue', subject: 'Math', time: 'Morning',
    title: 'Finish PP1A (2025 Paper 1)',
    note: 'Time yourself with the duration on the cover page. Do it on your own.' },
  { id: 'b-pp1b', kid: 'bryan', group: 'tue', subject: 'Math', time: 'Afternoon',
    title: 'Finish PP1B (2025 Paper 2)',
    note: 'Time yourself with the duration on the cover page. Do it on your own.' },
  { id: 'b-en-pb', kid: 'bryan', group: 'tue', subject: 'English',
    title: 'English Practice B (1 hour only)',
    note: "Do Sections A to F only. Skip Section G (Comprehension). Section B: look up the options in a dictionary and write down what they mean. Use the strategies from class for each section so you get them right. S&T 'whose' question: give it a try, or leave it blank if you don't know how." },

  { id: 'b-sls-check', kid: 'bryan', group: 'wed', subject: 'Math',
    title: 'Check your answers on SLS',
    note: 'Ms Chua will use your answer-checking to pick questions for class discussion.' },
  { id: 'b-sls-irs', kid: 'bryan', group: 'wed', subject: 'Math',
    title: 'Do the IRS Unit 5 module on SLS' },
  { id: 'b-en-cloze', kid: 'bryan', group: 'wed', subject: 'English',
    title: 'Cloze Comprehension: Mona Lisa and Eliezer Wiesel',
    note: 'Use the strategies from class: collocation and context clues.' },
  { id: 'b-en-mark', kid: 'bryan', group: 'wed', subject: 'English',
    title: 'Mark English Practice A and B yourself',
    note: 'Mark in pencil and write your corrections in green. For S&T, write the whole sentence out again. Your teacher will post the answers on the class blog next Wednesday.' },

  { id: 'j-xpy', kid: 'jordan', group: 'week', subject: 'Chinese',
    title: '新朋友' },
  { id: 'j-ezhishi', kid: 'jordan', group: 'week', subject: 'Chinese',
    title: 'ezhishi.net',
    note: 'A learning website. Your teacher put assignments inside for you.',
    link: 'https://ezhishi.net', linkText: 'Open ezhishi.net →' },
  { id: 'j-animal-book', kid: 'jordan', group: 'week', subject: 'Project',
    title: 'My Animal Mini Book',
    note: 'Choose an animal you like (not a giraffe). Find some fun facts about it and write them in your four-page booklet. Keep each fact short and easy to read. You can draw or add a picture of your animal too. Do it over the weekend and Mon–Wed.' },

  { id: 'b-zh-l15-dictation', kid: 'bryan', group: 'week', subject: 'Chinese',
    title: '复习第15课听写/默写',
    note: '10月15日（星期四）考查。' },
  { id: 'b-zh-l15-16-words', kid: 'bryan', group: 'week', subject: 'Chinese',
    title: '做第15课和第16课词语册子' },
  { id: 'b-zh-supp7', kid: 'bryan', group: 'week', subject: 'Chinese',
    title: '做补充练习（七）' },
  { id: 'b-sci-pp2', kid: 'bryan', group: 'week', subject: 'Science',
    title: 'Science Practice Paper 2',
    note: 'Do it like a real exam: 1 hour 45 minutes, shade the OAS answer sheet, and no Science notes or books. This helps you get ready for the Science EYE.' }
];

(function () {
  var NAMES = { bryan: 'Bryan', jordan: 'Jordan' };
  var KEY = 'todo_checked_v1';      // copy of the ticks on this device
  var PENDING_KEY = 'todo_pending_v1';  // changes not yet saved online
  // Same Supabase project and publishable key as the 中文练字 page (write.html).
  var CLOUD_URL = 'https://uscpgatqeeqejbwnvyoh.supabase.co';
  var CLOUD_KEY = 'sb_publishable_Tc5qBurC5SnTyNjB2jtA2A_jFs9T3og';
  var checked = {}, pending = {}, cloud = 'connecting';
  var kid = 'all';

  try { checked = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { checked = {}; }
  try { pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '{}') || {}; } catch (e) { pending = {}; }
  var db = null;
  try { db = window.supabase.createClient(CLOUD_URL, CLOUD_KEY); } catch (e) { db = null; }
  try {
    var q = new URLSearchParams(location.search).get('kid');
    if (q === 'bryan' || q === 'jordan') kid = q;
    // Opened from a child's page: go back there instead of Home.
    var back = document.getElementById('back');
    if (q === 'bryan') { back.href = 'bryan/index.html'; back.textContent = '← Bryan'; }
    if (q === 'jordan') { back.href = 'jordan.html'; back.textContent = '← Jordan'; }
  } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(checked)); localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); } catch (e) {}
  }

  var STATUS = {
    connecting: 'Connecting…',
    ok: 'Ticks are saved online, so they show on every device.',
    offline: "Can't reach the internet right now. Ticks are kept on this device and will save online when it's back.",
    setup: "Online saving isn't set up yet, so ticks are only kept on this device."
  };
  function setCloud(state) {
    cloud = state;
    document.getElementById('foot').textContent = STATUS[state] + ' List updated ' + UPDATED + '.';
  }
  function cloudError(err) {
    var msg = (err && (err.code + ' ' + err.message)) || '';
    setCloud(/42P01|PGRST205|does not exist|schema cache/i.test(msg) ? 'setup' : 'offline');
  }
  // Save changes made on this device.
  function push() {
    if (!db) { setCloud('offline'); return; }
    var rows = Object.keys(pending).map(function (id) { return { task_id: id, done: pending[id], updated_at: new Date().toISOString() }; });
    if (!rows.length) return;
    db.from('todo_checks').upsert(rows, { onConflict: 'task_id' }).then(function (res) {
      if (res.error) throw res.error;
      rows.forEach(function (r) { if (pending[r.task_id] === r.done) delete pending[r.task_id]; });
      save(); setCloud('ok');
    }).catch(cloudError);
  }
  // Load ticks made on any device; changes not yet saved from here win.
  function pull() {
    if (!db) { setCloud('offline'); return; }
    db.from('todo_checks').select('task_id,done').then(function (res) {
      if (res.error) throw res.error;
      var online = {};
      res.data.forEach(function (r) { online[r.task_id] = r.done; });
      // Ticks made on this device before online saving existed.
      Object.keys(checked).forEach(function (id) { if (!(id in online) && !(id in pending)) pending[id] = true; });
      var next = {};
      Object.keys(online).forEach(function (id) { if (online[id]) next[id] = true; });
      Object.keys(pending).forEach(function (id) { if (pending[id]) next[id] = true; else delete next[id]; });
      checked = next; save(); render(); setCloud('ok');
      push();
    }).catch(cloudError);
  }
  function shown(t) { return kid === 'all' || t.kid === kid; }

  function toggle(id) {
    if (checked[id]) delete checked[id]; else checked[id] = true;
    pending[id] = !!checked[id];
    save(); render(); push();
  }

  function makeTask(t) {
    var done = !!checked[t.id];
    var row = el('div', 'task' + (done ? ' done' : ''));
    row.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a')) return;
      toggle(t.id);
    });

    var box = el('button', 'box');
    box.type = 'button';
    box.setAttribute('role', 'checkbox');
    box.setAttribute('aria-checked', done ? 'true' : 'false');
    box.setAttribute('aria-label', t.title);
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
    box.addEventListener('click', function (e) { e.stopPropagation(); toggle(t.id); });
    row.appendChild(box);

    var body = el('div');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'who ' + t.kid, NAMES[t.kid]));
    meta.appendChild(el('span', 'subj', [t.subject, t.time].filter(Boolean).join(' · ')));
    body.appendChild(meta);
    body.appendChild(el('div', 't', t.title));
    if (t.note) body.appendChild(el('p', 'note', t.note));
    if (t.link) {
      var a = el('a', 'go', t.linkText || t.link);
      a.href = t.link; a.target = '_blank'; a.rel = 'noopener';
      body.appendChild(a);
    }
    row.appendChild(body);
    return row;
  }

  function render() {
    var board = document.getElementById('board');
    board.textContent = '';
    var visible = TASKS.filter(shown);
    var done = visible.filter(function (t) { return checked[t.id]; }).length;

    document.getElementById('count').textContent =
      visible.length && done === visible.length ? 'All done! 🎉' : done + ' of ' + visible.length + ' done';
    document.getElementById('fill').style.width = visible.length ? Math.round(done / visible.length * 100) + '%' : '0';

    if (!visible.length) {
      board.appendChild(el('div', 'empty', 'Nothing here yet.'));
      return;
    }
    GROUPS.forEach(function (g) {
      var list = visible.filter(function (t) { return t.group === g.id; });
      if (!list.length) return;
      var sec = el('section', 'day');
      sec.appendChild(el('h2', null, g.title));
      sec.appendChild(el('p', 'sub', g.sub));
      var wrap = el('div', 'list');
      list.forEach(function (t) { wrap.appendChild(makeTask(t)); });
      sec.appendChild(wrap);
      board.appendChild(sec);
    });
  }

  document.querySelectorAll('.kids button').forEach(function (b) {
    b.addEventListener('click', function () { kid = b.getAttribute('data-kid'); sync(); render(); });
  });
  function sync() {
    document.querySelectorAll('.kids button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-kid') === kid ? 'true' : 'false');
    });
  }

  document.getElementById('hello').textContent = 'Tap a box when you finish a task.';
  setCloud('connecting');
  sync();
  render();
  pull();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') pull(); });
  window.addEventListener('online', pull);
})();
</script>
</body>
</html>
