<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bryan & Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --desk:#16324F;--paper:#FFFFFF;--red:#E5383B;--ink:#16324F;--mute:#66768A;
  --sun:#FFB703;--sky:#8ECAE6;--line:#E3E8EE;
  --display:"Archivo Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:17px/1.55 var(--body);min-height:100vh;
  background-image:radial-gradient(circle at 20% 0%,#1F4468 0,transparent 55%)}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:baseline;color:#C9D6E3;margin-bottom:22px}
.top b{font-family:var(--display);font-weight:400;color:#fff;font-size:20px;letter-spacing:.01em}
.top span{font-size:14px}
.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}

/* tear-off calendar */
.pad{position:relative;perspective:1200px}
.pad::before,.pad::after{content:"";position:absolute;left:10px;right:10px;height:100%;background:#F1F4F7;border-radius:4px 4px 14px 14px;z-index:0}
.pad::before{top:10px}
.pad::after{top:5px;left:5px;right:5px;background:#F8FAFB}
.sheet{position:relative;z-index:1;background:var(--paper);border-radius:4px 4px 14px 14px;box-shadow:0 18px 40px #0007;
  transform-origin:50% 0;min-height:420px;display:flex;flex-direction:column}
.sheet.tear{animation:tear .55s cubic-bezier(.5,0,.75,0) forwards}
@keyframes tear{to{transform:rotateX(70deg) translateY(-30px) rotateZ(-4deg);opacity:0}}
.binding{background:var(--red);color:#fff;border-radius:4px 4px 0 0;padding:20px 22px 12px;position:relative;
  display:flex;justify-content:space-between;align-items:flex-end;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.binding::before,.binding::after{content:"";position:absolute;top:-9px;width:14px;height:24px;border-radius:7px;background:#C5CED8;box-shadow:inset 0 -3px 0 #9AA7B4}
.binding::before{left:28%}.binding::after{right:28%}
.date{font-family:var(--display);font-size:clamp(96px,18vw,150px);line-height:.9;text-align:center;margin:18px 0 6px;color:var(--ink)}
.body{padding:6px 26px 22px;flex:1;display:flex;flex-direction:column}
.label{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  border-top:2px dashed var(--line);padding-top:14px}
.emoji{font-size:24px}
.fact{font-size:clamp(20px,2.6vw,24px);line-height:1.45;margin:10px 0 18px;font-weight:700}
.tearbtn{margin-top:auto;align-self:flex-start;border:2px solid var(--ink);background:none;color:var(--ink);font:700 16px var(--body);
  padding:10px 16px;border-radius:999px;cursor:pointer}
.tearbtn:hover{background:var(--ink);color:#fff}
.tearbtn:focus-visible,.door:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* doors */
.doors{display:grid;gap:18px}
.door{display:block;text-decoration:none;border-radius:18px;padding:20px 20px 18px;color:var(--ink);position:relative;overflow:hidden;
  transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door.bryan{background:var(--sun)}
.door.jordan{background:var(--sky)}
.door h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1}
.door .who{font-size:14px;font-weight:700;opacity:.75;margin-bottom:10px}
.door ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.door li{background:#ffffff8c;border-radius:8px;padding:3px 10px;font-size:15px}
.door .go{position:absolute;right:18px;top:16px;font-family:var(--display);font-size:28px}

@media(max-width:760px){.layout{grid-template-columns:1fr}.sheet{min-height:0}}
@media(prefers-reduced-motion:reduce){.sheet.tear{animation:none}.door{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Bryan &amp; Jordan</b><span>学习小站</span></div>
  <div class="layout">
    <div class="pad">
      <article class="sheet" id="sheet">
        <div class="binding"><span id="month"></span><span id="weekday"></span></div>
        <div class="date" id="date"></div>
        <div class="body">
          <div class="label"><span class="emoji" id="emoji"></span>Today's surprise</div>
          <p class="fact" id="fact"></p>
          <button class="tearbtn" id="tear">Tear off · another fact</button>
        </div>
      </article>
    </div>
    <nav class="doors">
      <a class="door bryan" href="../bryan/index.html">
        <span class="go">→</span>
        <div class="who">Bryan 的学习</div>
        <h2>Bryan</h2>
        <ul style="margin-top:14px"><li>必考字 350</li><li>作文模板</li><li>好词好句</li><li>English</li><li>Science</li></ul>
      </a>
      <a class="door jordan" href="../jordan.html">
        <span class="go">→</span>
        <div class="who">Jordan 的学习</div>
        <h2>Jordan</h2>
        <ul style="margin-top:14px"><li>中文练字</li><li>听写测试</li><li>英文拼写</li><li>拼字游戏</li></ul>
      </a>
    </nav>
  </div>
</div>
<script src="../facts.js"></script>
<script>
const d = new Date();
document.getElementById('month').textContent = d.toLocaleDateString('en-GB',{month:'long'});
document.getElementById('weekday').textContent = d.toLocaleDateString('en-GB',{weekday:'long'});
document.getElementById('date').textContent = d.getDate();
let i = factIndexForToday();
function show(){ const f = FACTS[i]; emoji.textContent = f.e; fact.textContent = f.fact; }
show();
const sheet = document.getElementById('sheet');
document.getElementById('tear').onclick = () => {
  i = (i + 1) % FACTS.length;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return show();
  sheet.classList.add('tear');
  setTimeout(() => { show(); sheet.classList.remove('tear'); }, 550);
};
</script>
</body>
</html>
