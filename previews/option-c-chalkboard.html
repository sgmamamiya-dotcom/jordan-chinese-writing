<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bryan & Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --wall:#E9EEF2;--board:#1F3A2E;--chalk:#F4F1E8;--yellow:#F7D774;--pink:#F4A6B8;--wood:#9C6B3F;--ink:#22303A;--mute:#5E6B75;
  --hand:"Gochi Hand",cursive;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font:17px/1.55 var(--body);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.top b{font-size:20px}
.top span{color:var(--mute);font-size:14px}

/* chalkboard */
.board{background:var(--board);border:14px solid var(--wood);border-radius:10px;box-shadow:inset 0 0 60px #0006,0 12px 24px #0003;
  color:var(--chalk);padding:26px 28px 30px;position:relative;
  background-image:radial-gradient(ellipse at 30% 20%,#ffffff0d,transparent 60%),radial-gradient(ellipse at 80% 90%,#ffffff08,transparent 50%)}
.board::after{content:"";position:absolute;left:12%;right:12%;bottom:-26px;height:12px;background:#7C522D;border-radius:0 0 6px 6px}
.qod{font-family:var(--hand);color:var(--pink);font-size:24px;display:flex;justify-content:space-between}
.q{font-family:var(--hand);font-size:clamp(32px,5.4vw,48px);line-height:1.2;margin:10px 0 20px;letter-spacing:.01em}
.q .em{display:inline-block;margin-right:10px}
.reveal{border:2px dashed #F4F1E899;background:none;color:var(--chalk);font:700 17px var(--body);padding:12px 18px;border-radius:12px;cursor:pointer}
.reveal:hover{background:#F4F1E814}
.reveal:focus-visible,.door:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.ans{display:none}
.ans.show{display:block;animation:in .4s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ans .a{font-family:var(--hand);color:var(--yellow);font-size:clamp(34px,5vw,44px);line-height:1.1}
.ans p{font-size:19px;line-height:1.5;margin:8px 0 0;max-width:640px}
.think{font-size:15px;opacity:.7;margin-left:12px}

/* doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:52px}
.door{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:14px;padding:18px 20px;position:relative;
  box-shadow:0 2px 0 #0000000f,0 10px 22px #0000001a;transition:transform .15s}
.door:hover{transform:rotate(-1deg) translateY(-2px)}
.door::before{content:"";position:absolute;top:-10px;left:50%;width:18px;height:18px;border-radius:50%;transform:translateX(-50%);box-shadow:inset 0 -3px 0 #0003}
.bryan::before{background:#E76F51}.jordan::before{background:#2A9D8F}
.door h2{font-family:var(--hand);font-weight:400;font-size:40px;margin:0;line-height:1}
.bryan h2{color:#C4512F}.jordan h2{color:#1F7F74}
.door p{margin:6px 0 0;color:var(--mute);font-size:15px}
.door .go{display:block;margin-top:12px;font-weight:700}
@media(max-width:600px){.doors{grid-template-columns:1fr}.board{padding:20px;border-width:10px}}
@media(prefers-reduced-motion:reduce){.ans.show{animation:none}.door{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Bryan &amp; Jordan 学习小站</b><span id="today"></span></div>

  <section class="board" aria-label="Question of the day">
    <div class="qod"><span>Question of the day</span></div>
    <div class="q"><span class="em" id="emoji"></span><span id="q"></span></div>
    <button class="reveal" id="btn">Show the answer</button><span class="think" id="think">Have a guess first!</span>
    <div class="ans" id="ans"><div class="a" id="a"></div><p id="fact"></p></div>
  </section>

  <nav class="doors">
    <a class="door bryan" href="../bryan/index.html">
      <h2>Bryan</h2>
      <p>必考字 350 · 作文模板 · 好词好句 · English · Science</p>
      <span class="go">Open Bryan's page →</span>
    </a>
    <a class="door jordan" href="../jordan.html">
      <h2>Jordan</h2>
      <p>中文练字 · 听写测试 · 英文拼写 · 拼字游戏</p>
      <span class="go">Open Jordan's page →</span>
    </a>
  </nav>
</div>
<script src="../facts.js"></script>
<script>
const now = new Date();
today.textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const i = factIndexForToday(), f = FACTS[i];
emoji.textContent = f.e; q.textContent = f.q; a.textContent = f.a + '!'; fact.textContent = f.fact;
btn.onclick = () => { ans.classList.add('show'); btn.hidden = true; think.hidden = true; };
</script>
</body>
</html>
